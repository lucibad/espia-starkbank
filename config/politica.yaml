# =====================================================================
# GerencIA — Política de Governança de Informações em IA
# ---------------------------------------------------------------------
# Este arquivo é o "contrato" entre a empresa e a ferramenta.
# A Stark Bank (ou qualquer organização) define AQUI o que é sensível,
# quais ferramentas são aceitáveis e como o risco é calculado.
# Nenhuma regra está escondida no código.
# =====================================================================

organizacao:
  nome: "Stark Bank"
  setor: "Instituição financeira regulada"
  # Marcos regulatórios que a política declara observar. Servem para
  # etiquetar as regras e para a evidência citar a origem da exigência.
  marcos_regulatorios:
    - id: LGPD
      nome: "Lei Geral de Proteção de Dados (Lei 13.709/2018)"
    - id: SIGILO_BANCARIO
      nome: "Sigilo de operações bancárias (LC 105/2001)"
    - id: BCB_CIBER
      nome: "Política de segurança cibernética exigida pelo Banco Central"
    - id: PCI_DSS
      nome: "PCI DSS — dados de portador de cartão"
    - id: ISO_42001
      nome: "ISO/IEC 42001 — sistema de gestão de IA"

# ---------------------------------------------------------------------
# 1. TAXONOMIA DE CLASSIFICAÇÃO
# A empresa define os níveis e o que pode ser feito com cada um.
# ---------------------------------------------------------------------
classificacao:
  publico:
    rotulo: "Público"
    peso: 1
    cor: "verde"
    descricao: "Já divulgado externamente. Site, material de marketing, docs públicas da API."
    ia_permitida: "qualquer"
  interno:
    rotulo: "Interno"
    peso: 3
    cor: "azul"
    descricao: "Uso interno, sem impacto se vazar para outro colaborador. Processos, runbooks, wiki."
    ia_permitida: "homologada_ou_corporativa"
  confidencial:
    rotulo: "Confidencial"
    peso: 7
    cor: "ambar"
    descricao: "Contratos, propostas, dados de clientes, planejamento, código proprietário."
    ia_permitida: "somente_homologada"
  critico:
    rotulo: "Crítico"
    peso: 12
    cor: "vermelho"
    descricao: "Sigilo bancário, dados de portador de cartão, modelos de risco, dados pessoais sensíveis, informação não divulgada com efeito material."
    ia_permitida: "nenhuma_sem_aprovacao"

# ---------------------------------------------------------------------
# 2. CATEGORIAS DE INFORMAÇÃO (as 6 do desafio + específicas do setor)
# ---------------------------------------------------------------------
categorias_informacao:
  dados_pessoais:      { rotulo: "Dados pessoais e de colaboradores", marcos: [LGPD] }
  clientes:            { rotulo: "Informações de clientes",           marcos: [LGPD, SIGILO_BANCARIO] }
  estrategica:         { rotulo: "Informações estratégicas",          marcos: [] }
  propriedade_intelectual: { rotulo: "Propriedade intelectual",       marcos: [] }
  juridico:            { rotulo: "Documentos jurídicos e contratuais", marcos: [] }
  comercial:           { rotulo: "Informações comerciais",            marcos: [] }
  financeiro_regulado: { rotulo: "Dados financeiros regulados",       marcos: [SIGILO_BANCARIO, PCI_DSS, BCB_CIBER] }

# ---------------------------------------------------------------------
# 3. FERRAMENTAS DE IA — o cadastro que o desafio pede no 1º bullet
# tier:
#   corporativa  = contrato empresarial, dados não usados em treinamento,
#                  acesso via SSO, DPA assinado
#   homologada   = aprovada pelo Comitê de IA com ressalvas
#   tolerada     = uso pessoal aceito apenas para dado público/interno
#   nao_homologada = sem contrato, sem DPA, sem controle
# ---------------------------------------------------------------------
ferramentas_ia:
