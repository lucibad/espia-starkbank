# ---------------------------------------------------------------------
# 4. MOTOR DE RISCO
# Score = (peso_classificacao × fator_ferramenta) × Π(multiplicadores)
#         + Σ(agravantes fixos)
# Tudo explícito, auditável e ajustável pelo time de Compliance.
# ---------------------------------------------------------------------
motor_risco:
  multiplicadores:
    treina_com_dados: 1.6          # o dado vira peso do modelo de terceiro
    jurisdicao_sem_adequacao: 1.5  # transferência internacional
    fora_horario: 1.25             # 22h-06h ou fim de semana
    canal_nao_gerenciado: 1.35     # capturado pela extensão, fora do gateway
    volume_alto: 1.3               # > 8.000 caracteres no prompt
    reincidencia: 1.4              # 3+ eventos similares do mesmo usuário em 7 dias
    sem_finalidade_declarada: 1.15

  agravantes:
    pii_em_volume: 8       # 20+ identificadores pessoais no mesmo prompt
    dado_cartao: 15        # padrão de PAN detectado (escopo PCI)
    credencial: 20         # chave de API, token, senha
    multiplos_ativos_criticos: 10

  atenuantes:
    mascaramento_aceito: -12   # o colaborador aceitou enviar versão anonimizada
    finalidade_aprovada: -4    # caso de uso pré-aprovado pelo Comitê de IA

  niveis:
    - { nivel: critico, min: 90, rotulo: "Crítico",  acao: "Bloquear, notificar CISO e DPO, abrir investigação" }
    - { nivel: alto,    min: 38, rotulo: "Alto",     acao: "Alertar gestor e Segurança da Informação em até 4h" }
    - { nivel: medio,   min: 12, rotulo: "Médio",    acao: "Registrar e revisar no comitê semanal" }
    - { nivel: baixo,   min: 0,  rotulo: "Baixo",    acao: "Somente registro para indicadores" }

# ---------------------------------------------------------------------
# 5. CASAMENTO DE ATIVOS (fingerprint)
# ---------------------------------------------------------------------
fingerprint:
  tamanho_shingle: 5          # n-gramas de palavras
  permutacoes_minhash: 128
  limiar_correspondencia: 0.18   # Jaccard mínimo para declarar correspondência
  limiar_alta_confianca: 0.45

# ---------------------------------------------------------------------
# 6. PRIVACIDADE DA PRÓPRIA FERRAMENTA
# Uma solução que lê tudo que o colaborador digita é, ela mesma, risco.
# ---------------------------------------------------------------------
privacidade:
  armazenar_conteudo_bruto: false     # só assinatura + metadados
  retencao_assinaturas_dias: 400
  retencao_trechos_evidencia_dias: 30
  exige_dupla_aprovacao_para_identificar: true
  campos_pseudonimizados_por_padrao: ["colaborador_nome", "colaborador_email"]
