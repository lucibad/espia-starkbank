# GerencIA — coletor de SWG / proxy web.
# Onda 0. Lê o log que o proxy já produz. Nenhuma mudança na navegação.

[entrada]
tipo      = arquivo
caminho   = /var/log/swg/acesso.log
formato   = w3c
seguir    = true

[dominios]
# Domínios de ferramenta conhecida, vindos da aba Ferramentas_IA da planilha.
# Atualizado pela publicação de política — não editar à mão.
fonte     = https://api.espia.interno:8083/ferramentas/dominios
cache_h   = 6

# O ponto alto deste coletor: o que NÃO está na lista.
# Domínio de IA generativa fora do cadastro vira evento de descoberta, e é
# assim que shadow AI aparece — não por denúncia, por log.
descoberta = true
heuristica = /etc/espia/heuristica-ia.txt

[saida]
url        = https://ingestao.espia.interno:8443/eventos
mtls_ca    = /etc/espia/ca-interna.crt
mtls_crt   = /etc/espia/coletor-swg.crt
mtls_key   = /etc/espia/coletor-swg.key
origem     = SWG

[privacidade]
# O proxy vê URL. URL pode conter dado. O coletor corta a query string antes de
# qualquer coisa, e nunca envia caminho completo.
somente_dominio = true
enviar_conteudo = false
