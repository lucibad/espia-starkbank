# GerencIA — exemplo de política de firewall da VLAN de Segurança.
#
# Não é para copiar: o banco tem firewall de borda próprio, e é lá que estas
# regras devem existir. Isto é a tradução das linhas do regras-firewall.csv
# numa linguagem que o time de redes lê em trinta segundos, para não haver
# ambiguidade sobre o que está sendo pedido.
#
# A regra que define o desenho é a última: a VLAN de Segurança não sai.

table inet espia {

  set coletores_autorizados {
    type ipv4_addr; flags interval
    elements = { 10.20.0.0/16,        # estações corporativas
                 10.30.4.10,          # servidor DLP
                 10.30.4.11 }         # SWG
  }

  set corporativo_permitido {
    type ipv4_addr
    elements = { 10.10.1.5,           # SSO
                 10.10.2.9,           # SIEM
                 10.10.3.7,           # registro de imagens
                 10.10.0.2 }          # NTP
  }

  chain entrada {
    type filter hook input priority 0; policy drop;

    ct state established,related accept
    iif "lo" accept

    # FW-01 a FW-04 — coletores falam com a ingestão, por mTLS, e só isso.
    ip saddr @coletores_autorizados tcp dport 8443 accept

    # FW-05 — consoles para quem tem acesso pela rede corporativa.
    ip saddr 10.20.0.0/16 tcp dport 443 accept

    # FW-10 — o gateway da DMZ consome a fila. Uma direção.
    ip saddr 10.50.1.20 tcp dport 6379 accept

    # FW-17 — nada mais entra. Inclusive, e principalmente, da internet.
    log prefix "espia-entrada-negada " limit rate 10/minute
  }

  chain saida {
    type filter hook output priority 0; policy drop;

    ct state established,related accept
    oif "lo" accept

    # FW-06 a FW-09, FW-16 — as únicas saídas, todas para dentro do banco.
    ip daddr @corporativo_permitido tcp dport { 443, 6514, 22 } accept
    ip daddr @corporativo_permitido udp dport 123 accept

    # FW-18 — e nada mais sai. Se esta linha for afrouxada "só para testar",
    # o isolamento do sistema acabou, e bin/verificar.sh --isolamento acusa.
    log prefix "espia-saida-negada " limit rate 10/minute
  }
}
