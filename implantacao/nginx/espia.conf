# EspIA — publicação dos dois consoles.
# Um servidor, dois caminhos, autenticação no SSO do banco.

server {
    listen 8081 ssl;
    http2 on;
    server_name console.espia.interno;

    ssl_certificate     /certs/espia.crt;
    ssl_certificate_key /certs/espia.key;
    ssl_protocols       TLSv1.2 TLSv1.3;
    ssl_ciphers         HIGH:!aNULL:!MD5;

    # Um console de investigação exibe dado sensível por definição. Se ele
    # puder ser embutido em outra página, vira vetor de exfiltração.
    add_header Strict-Transport-Security "max-age=31536000" always;
    add_header X-Frame-Options "DENY" always;
    add_header X-Content-Type-Options "nosniff" always;
    add_header Referrer-Policy "no-referrer" always;
    add_header Content-Security-Policy
        "default-src 'self'; script-src 'self'; style-src 'self' 'unsafe-inline'; connect-src 'self'; frame-ancestors 'none'" always;

    # Nada de cache: o que aparece na tela é dado de investigação.
    add_header Cache-Control "no-store, no-cache, must-revalidate" always;

    location /saude { access_log off; return 200 "ok\n"; }

    location /investigacao/ {
        alias /app/dashboard/;
        try_files $uri $uri/ /investigacao/painel.html;
    }

    location /politicas/ {
        alias /app/dashboard/;
        try_files $uri /politicas/console-politicas.html;
    }

    location /api/ {
        proxy_pass http://api:8083/;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-Proto https;
        proxy_read_timeout 60s;
    }

    location = / { return 302 /investigacao/; }
}
