<title>GerencIA</title>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Red+Hat+Text:wght@400;500;600;700&family=Red+Hat+Display:wght@600;700;800&display=swap">
<style>
/* ===== Tokens — paleta "Grafite" (referência: Opção 1 · Grafite / Main.dc.html) =====
   Convenções mantidas: cor = risco; densidade de cinza = classificação da informação. */
:root {
  --bg: #F4F6FA; --surface: #ffffff; --surface-2: #F1F4F9;
  --line: #E3E8F0; --line-2: #EDF1F7; --border: #D3DAE6;
  --ink-h: #1F2733; --ink: #262F3D; --ink-2: #4A5565; --ink-3: #667085; --ink-4: #8A94A6;
  --side: #1F2733; --side-muted: #C9D3E3; --side-faint: #8E9AB0; --nav-active: #3B6FE0;
  --logo-bg: #3B6FE0; --logo-accent: #7DB3F7;
  --primary: #3B6FE0; --primary-soft: #E8EFFC;
  --accent: var(--primary); --accent-soft: var(--primary-soft);
  --bar: #3B6FE0; --bar-soft: #E3E8F0; --spark: #3B6FE0;

  --sev-Critico: #1A3170; --sev-Critico-bg: #DCE5F7; --sev-Critico-ink: #1A3170; --crit-hero: #9CC5FA;
  --sev-Alto: #2F5FCC;    --sev-Alto-bg: #E8EFFC;    --sev-Alto-ink: #1E4FB5;
  --sev-Medio: #5F96EE;   --sev-Medio-bg: #EEF4FD;   --sev-Medio-ink: #2F5FCC;
  --sev-Baixo: #AAB7CC;   --sev-Baixo-bg: #F1F4F9;   --sev-Baixo-ink: #4A5565;
  --sev-Revisar: #8A94A6; --sev-Revisar-bg: #EEF0F4; --sev-Revisar-ink: #4A5565;

  --sens-crit: #262F3D; --sens-conf: #9AA6BA;
  --cls-Critica: #262F3D; --cls-Critica-ink: #ffffff;
  --cls-Confidencial: #E3E8F0; --cls-Confidencial-ink: #262F3D;
  --cls-Interna: #F1F4F9; --cls-Interna-ink: #4A5565;
  --cls-Publica: #ffffff; --cls-Publica-ink: #667085;

  --ok: #3B6FE0; --ok-ink: #1E4FB5; --ok-bg: #E8EFFC; --ok-ring: #DCE8FB; --real-dot: #9CC5FA;
  --shadow: inset 0 0 0 1px #e8eaee;
  --shadow-lift: inset 0 0 0 1px #e8eaee, 0 8px 16px -8px rgba(19,23,26,.12);

  --f-display: "Red Hat Display", system-ui, sans-serif;
  --f-body: "Red Hat Text", system-ui, sans-serif;
  --f-mono: "Red Hat Text", system-ui, sans-serif;
  --r: 16px;
}
* { box-sizing: border-box; }
html, body { margin: 0; }
body { background: var(--bg); color: var(--ink); font-family: var(--f-body); font-size: 14px; line-height: 1.5; font-variant-numeric: tabular-nums; -webkit-font-smoothing: antialiased; }
a { color: var(--primary); text-decoration: none; font-weight: 600; }
a:hover { text-decoration: underline; }
h1, h2, h3 { font-family: var(--f-display); margin: 0; color: var(--ink-h); }
button, input, select { font: inherit; color: inherit; }
.mono { font-variant-numeric: tabular-nums; }
.muted { color: var(--ink-3); }
.small { font-size: 12px; }

/* ===== Layout: menu lateral escuro + conteúdo ===== */
.app { display: grid; grid-template-columns: 248px minmax(0, 1fr); min-height: 100vh; }
.side { position: sticky; top: 0; height: 100vh; overflow-y: auto; background: var(--side); color: #fff; padding: 28px 20px; display: flex; flex-direction: column; gap: 28px; }
.brand { display: flex; flex-direction: column; gap: 8px; }
.logo-svg { width: 168px; height: auto; display: block; }
.brand-t small { font-size: 12px; color: var(--side-muted); }
.logo { width: 40px; height: 40px; border-radius: 12px; background: var(--logo-bg); display: grid; place-items: center; flex: none; }
.brand-t b { display: block; font-family: var(--f-display); font-weight: 800; font-size: 22px; letter-spacing: -0.01em; line-height: 1.15; }
.brand-t b span { color: var(--logo-accent); }
.brand-t small { font-size: 12px; color: var(--side-muted); }
.nav { display: flex; flex-direction: column; gap: 4px; }
.nav a { display: flex; align-items: center; gap: 12px; padding: 12px 14px; border-radius: 10px; color: var(--side-muted); font-weight: 500; font-size: 15px; white-space: nowrap; }
.nav a svg { width: 18px; height: 18px; flex: none; stroke: currentColor; fill: none; stroke-width: 2; stroke-linecap: round; stroke-linejoin: round; }
.nav a:hover { background: rgba(255,255,255,.06); color: #fff; text-decoration: none; }
.nav a[aria-current="page"] { background: var(--nav-active); color: #fff; font-weight: 600; }
.nav .badge { margin-left: auto; background: var(--sev-Critico); color: #fff; font-size: 12px; font-weight: 700; padding: 2px 8px; border-radius: 999px; }
.side-sec { font-size: 11px; font-weight: 700; letter-spacing: .16em; text-transform: uppercase; color: var(--side-faint); margin-bottom: 10px; }
.fontes { background: rgba(255,255,255,.06); border: 1px solid rgba(255,255,255,.12); border-radius: 12px; padding: 14px; display: flex; flex-direction: column; gap: 10px; }
.fontes a { display: flex; justify-content: space-between; align-items: baseline; color: var(--side-muted); font-size: 13px; font-weight: 500; border-radius: 6px; padding: 2px 6px; margin: 0 -6px; }
.fontes a:hover { background: rgba(255,255,255,.08); text-decoration: none; }
.fontes a[aria-pressed="true"] { background: rgba(255,255,255,.12); color: #fff; }
.fontes a b { font-size: 20px; color: #fff; font-weight: 700; }
.fontes .dot { display: inline-block; width: 8px; height: 8px; border-radius: 50%; background: var(--logo-accent); margin-right: 6px; }
.fbar { height: 6px; border-radius: 999px; background: rgba(255,255,255,.14); overflow: hidden; }
.fbar i { display: block; height: 100%; background: var(--logo-accent); }
.fontes .cap { font-size: 12px; color: var(--side-faint); line-height: 1.4; }
.disc { margin-top: auto; font-size: 12px; color: var(--side-faint); line-height: 1.5; }
.content { min-width: 0; display: flex; flex-direction: column; }

/* ===== Cabeçalho ===== */
.top { position: sticky; top: 0; z-index: 20; background: #fff; border-bottom: 1px solid var(--line); }
.top-in { padding: 14px 32px; display: flex; flex-wrap: wrap; align-items: center; gap: 16px; }
.top-in .ctx { font-size: 14px; color: var(--ink-2); flex: 1 1 240px; }
.top-in .ctx i { font-style: normal; color: #9fa5ad; }
.search { position: relative; flex: 0 1 420px; min-width: 220px; }
.search label { display: flex; align-items: center; gap: 10px; background: var(--surface-2); border: 1px solid var(--border); border-radius: 10px; padding: 10px 14px; }
.search label:focus-within { border-color: var(--primary); background: #fff; }
.search input { border: 0; background: transparent; outline: none; font-size: 14px; color: var(--ink); width: 100%; }
.coletor { display: flex; align-items: center; gap: 8px; font-size: 13px; color: var(--ok-ink); font-weight: 600; background: var(--ok-bg); padding: 8px 12px; border-radius: 999px; white-space: nowrap; }
.coletor::before { content: ""; width: 8px; height: 8px; border-radius: 50%; background: var(--ok); }
.coletor.off { color: var(--ink-2); background: var(--surface-2); }
.coletor.off::before { background: var(--ink-4); }
.sugg { position: absolute; top: 48px; left: 0; right: 0; z-index: 30; background: #fff; border-radius: 12px; box-shadow: var(--shadow), 0 12px 28px -8px rgba(19,23,26,.2); max-height: 380px; overflow: auto; padding: 6px; }
.sugg a { display: flex; gap: 8px; align-items: baseline; padding: 8px 10px; border-radius: 8px; color: var(--ink); font-weight: 500; }
.sugg a:hover, .sugg a.on { background: var(--primary-soft); text-decoration: none; }
.sugg .k { font-size: 10.5px; font-weight: 700; letter-spacing: .06em; color: var(--ink-3); text-transform: uppercase; width: 82px; flex: none; }
.sugg .empty { padding: 10px; color: var(--ink-3); }

/* ===== Página ===== */
main { padding: 28px 32px 48px; max-width: 1320px; width: 100%; }
.head { display: flex; flex-wrap: wrap; justify-content: space-between; align-items: flex-end; gap: 16px; margin-bottom: 24px; }
.head h1 { font-size: 36px; font-weight: 800; letter-spacing: -0.02em; }
.head p { margin: 6px 0 0; font-size: 15px; color: var(--ink-2); max-width: 78ch; }
.head .right { margin-left: auto; }
.crumb { font-size: 13px; color: var(--ink-3); margin-bottom: 6px; }
.hctl { display: flex; flex-wrap: wrap; gap: 10px; align-items: center; }
.seg { display: flex; background: #fff; border: 1px solid var(--border); border-radius: 10px; padding: 3px; }
.seg button { min-height: 36px; padding: 0 14px; border: 0; border-radius: 8px; background: transparent; color: var(--primary); font-size: 14px; font-weight: 600; cursor: pointer; white-space: nowrap; }
.seg button span { opacity: .7; font-weight: 500; }
.seg button[aria-pressed="true"] { background: var(--primary); color: #fff; font-weight: 700; }
.fbtn { display: flex; align-items: center; gap: 8px; min-height: 42px; padding: 0 14px; border-radius: 10px; border: 1px solid var(--border); background: #fff; color: var(--ink); font-size: 14px; font-weight: 600; cursor: pointer; }
.fbtn[aria-expanded="true"] { border-color: var(--primary); }
.fbtn .n { background: var(--primary); color: #fff; font-size: 11px; font-weight: 700; border-radius: 999px; padding: 1px 7px; }
.fpanel { background: #fff; border-radius: var(--r); box-shadow: var(--shadow); padding: 16px 20px; display: flex; flex-wrap: wrap; gap: 12px 18px; align-items: flex-end; margin: -8px 0 20px; }
.fpanel label { display: flex; flex-direction: column; gap: 4px; font-size: 12px; font-weight: 600; color: var(--ink-2); }
.fpanel select, .fpanel input { height: 40px; border: 1px solid var(--border); border-radius: 10px; background: #fff; padding: 0 10px; min-width: 170px; font-size: 14px; }
.chips { display: flex; gap: 8px; flex-wrap: wrap; align-items: center; margin: -8px 0 20px; }
.chip { display: inline-flex; align-items: center; gap: 4px; background: #fff; box-shadow: inset 0 0 0 1px var(--border); color: var(--ink); border-radius: 999px; padding: 4px 6px 4px 12px; font-size: 13px; font-weight: 600; }
.chip button { border: 0; background: transparent; cursor: pointer; color: var(--ink-3); padding: 0 6px; font-size: 16px; line-height: 1; }
.linkbtn { border: 0; background: none; color: var(--primary); cursor: pointer; font-size: 13px; font-weight: 700; padding: 4px; }

.grid { display: grid; gap: 16px; }
.g-2 { grid-template-columns: repeat(2, minmax(0, 1fr)); }
.g-3-1 { grid-template-columns: minmax(0, 2fr) minmax(0, 1fr); }
.mt { margin-top: 16px; }
.card { background: #fff; border-radius: var(--r); box-shadow: var(--shadow); padding: 24px; min-width: 0; }
.card-h { display: grid; grid-template-columns: minmax(0, 1fr) auto; column-gap: 12px; row-gap: 4px; margin-bottom: 16px; align-items: start; }
.card-h h3 { grid-column: 1; font-size: 18px; font-weight: 700; }
.card-h .hint { grid-column: 1; font-size: 13px; color: var(--ink-3); }
.card-h .r, .card-h .legend { grid-column: 2; grid-row: 1 / span 2; margin: 0; font-size: 13px; font-weight: 700; white-space: nowrap; }
.sub-h { font-size: 14px; font-weight: 700; color: var(--ink-h); margin: 6px 0 10px; font-family: var(--f-body); }

/* ===== Hero de metas ===== */
.hero { background: var(--side); border-radius: 20px; padding: 28px; color: #fff; display: grid; grid-template-columns: repeat(auto-fit, minmax(200px, 1fr)); gap: 24px; align-items: center; margin-bottom: 16px; }
.hero h2 { color: #fff; font-size: 28px; font-weight: 700; line-height: 1.2; }
.hero p { margin: 0; font-size: 14px; color: var(--side-muted); line-height: 1.5; }
.hero .flag { display: inline-flex; align-self: flex-start; align-items: center; gap: 8px; background: var(--sev-Critico); color: #fff; font-size: 12px; font-weight: 700; letter-spacing: .08em; text-transform: uppercase; padding: 6px 12px; border-radius: 999px; }
.hero .flag.ok { background: var(--ok); }
.hero .lead { display: flex; flex-direction: column; gap: 10px; }
.hero .m { background: rgba(255,255,255,.07); border: 1px solid rgba(255,255,255,.14); border-radius: 14px; padding: 18px; display: flex; flex-direction: column; gap: 10px; color: #fff; }
.hero .m .l { font-size: 13px; color: var(--side-muted); }
.hero .m .v { display: flex; align-items: baseline; gap: 10px; }
.hero .m .v b { font-family: var(--f-display); font-size: 40px; font-weight: 800; line-height: 1.05; }
.hero .m .v span { font-size: 13px; color: var(--crit-hero); }
.hero .m .v span.ok { color: var(--real-dot); }
.hero .m .track { position: relative; height: 8px; border-radius: 999px; background: rgba(255,255,255,.14); }
.hero .m .track i { display: block; height: 100%; border-radius: 999px; background: var(--crit-hero); }
.hero .m .track i.ok { background: var(--real-dot); }
.hero .m .track u { position: absolute; top: -4px; width: 2px; height: 16px; background: var(--real-dot); }
.hero .m .f { font-size: 12px; color: var(--side-faint); }
.hero .m a.go { align-self: flex-start; display: inline-flex; align-items: center; min-height: 36px; padding: 0 14px; border-radius: 8px; background: #fff; color: var(--side); font-size: 13px; font-weight: 700; }

/* ===== Cards de indicadores ===== */
.kpis { display: grid; grid-template-columns: repeat(auto-fit, minmax(300px, 1fr)); gap: 16px; margin-bottom: 16px; }
.kpi { background: #fff; border-radius: var(--r); box-shadow: var(--shadow-lift); padding: 22px; display: flex; flex-direction: column; gap: 10px; color: var(--ink); min-width: 0; font-weight: 400; }
a.kpi:hover { text-decoration: none; box-shadow: inset 0 0 0 1px var(--border), 0 10px 20px -8px rgba(19,23,26,.18); }
.kpi-top { display: flex; justify-content: space-between; align-items: center; gap: 10px; }
.kpi .lab { font-size: 14px; font-weight: 600; color: var(--ink-2); }
.kpi .val { font-family: var(--f-display); font-size: 40px; font-weight: 800; color: var(--ink-h); line-height: 1; }
.kpi .val small { font-family: var(--f-body); font-size: 16px; font-weight: 600; color: var(--ink-2); margin-left: 8px; }
.kpi .foot { font-size: 13px; color: var(--ink-2); display: flex; gap: 8px; flex-wrap: wrap; align-items: center; }
.kpi svg.sp { width: 100%; height: 44px; display: block; }
.ico { width: 32px; height: 32px; border-radius: 8px; background: var(--primary-soft); color: var(--primary); display: grid; place-items: center; flex: none; }
.ico svg { width: 16px; height: 16px; fill: none; stroke: currentColor; stroke-width: 2; stroke-linecap: round; stroke-linejoin: round; }
.stack { display: flex; height: 10px; border-radius: 999px; overflow: hidden; background: var(--line); gap: 2px; margin-top: 6px; }
.stack i { display: block; height: 100%; }
.meta { font-size: 12px; font-weight: 700; padding: 4px 10px; border-radius: 999px; white-space: nowrap; }
.meta.fora { background: var(--sev-Critico-bg); color: var(--sev-Critico-ink); }
.meta.dentro { background: var(--ok-bg); color: var(--ok-ink); }
.pill-n { background: var(--surface-2); box-shadow: inset 0 0 0 1px var(--line); padding: 3px 8px; border-radius: 999px; color: var(--ink-2); font-size: 12px; }

/* ===== Etiquetas ===== */
.risk { display: inline-flex; align-items: center; justify-content: center; font-size: 11px; font-weight: 700; padding: 3px 10px; border-radius: 999px; white-space: nowrap; min-width: 64px; }
.risk.Critico { background: var(--sev-Critico-bg); color: var(--sev-Critico-ink); }
.risk.Alto { background: var(--sev-Alto-bg); color: var(--sev-Alto-ink); }
.risk.Medio { background: var(--sev-Medio-bg); color: var(--sev-Medio-ink); }
.risk.Baixo { background: var(--sev-Baixo-bg); color: var(--sev-Baixo-ink); box-shadow: inset 0 0 0 1px var(--line); }
.risk.Revisar { background: var(--sev-Revisar-bg); color: var(--sev-Revisar-ink); }
.cls { font-size: 11px; font-weight: 700; padding: 2px 8px; border-radius: 999px; white-space: nowrap; }
.cls.Critica { background: var(--cls-Critica); color: var(--cls-Critica-ink); }
.cls.Confidencial { background: var(--cls-Confidencial); color: var(--cls-Confidencial-ink); }
.cls.Interna { background: var(--cls-Interna); color: var(--cls-Interna-ink); box-shadow: inset 0 0 0 1px var(--line); }
.cls.Publica { background: var(--cls-Publica); color: var(--cls-Publica-ink); box-shadow: inset 0 0 0 1px var(--border); }
.st { font-size: 11px; font-weight: 700; padding: 2px 8px; border-radius: 999px; white-space: nowrap; display: inline-block; }
.st.ok { background: var(--ok-bg); color: var(--ok-ink); }
.st.cond { background: var(--sev-Medio-bg); color: var(--sev-Medio-ink); }
.st.nao { background: var(--sev-Critico-bg); color: var(--sev-Critico-ink); }
.rule { font-size: 11px; font-weight: 700; background: var(--surface-2); box-shadow: inset 0 0 0 1px var(--line); border-radius: 6px; padding: 1px 6px; color: var(--ink-2); }
.src { display: inline-flex; align-items: center; gap: 5px; font-size: 11px; font-weight: 700; border-radius: 999px; padding: 2px 8px; white-space: nowrap; }
.src.planilha { background: var(--surface-2); color: var(--ink-2); box-shadow: inset 0 0 0 1px var(--line); }
.src.coleta { background: var(--primary-soft); color: #2453C0; }
.src.coleta::before { content: ""; width: 6px; height: 6px; border-radius: 50%; background: var(--primary); }

/* ===== Legenda ===== */
.legend { display: flex; gap: 14px; flex-wrap: wrap; font-size: 12px; font-weight: 500; color: var(--ink-2); margin-top: 10px; }
.legend span { display: inline-flex; align-items: center; gap: 6px; }
.legend i { width: 10px; height: 10px; border-radius: 3px; display: inline-block; }

/* ===== Barras horizontais ===== */
.hb { display: grid; grid-template-columns: minmax(120px, 38%) minmax(0, 1fr) 52px; gap: 12px; align-items: center; }
.hb .l { font-size: 14px; font-weight: 600; color: var(--ink); overflow: hidden; text-overflow: ellipsis; white-space: nowrap; display: flex; flex-direction: column; gap: 3px; align-items: flex-start; }
.hb .l > small { font-weight: 400; }
.hb .t { height: 12px; display: flex; gap: 2px; }
.hb .t > i { display: block; height: 100%; min-width: 2px; border-radius: 3px; }
.hb .v { font-size: 14px; font-weight: 700; text-align: right; color: var(--ink-h); }
.hb .v em { font-style: normal; font-weight: 700; color: var(--sev-Critico-ink); }
.hb .v small { font-weight: 500; color: var(--ink-2); font-size: 13px; }
.hb a.row { display: contents; color: inherit; font-weight: inherit; }
.hb a.row:hover .l { text-decoration: underline; }
.thin { display: flex; flex-direction: column; gap: 14px; }
.thin a { display: flex; flex-direction: column; gap: 6px; color: var(--ink); font-weight: 600; }
.thin a:hover { text-decoration: none; }
.thin a:hover .nm { text-decoration: underline; }
.thin .hd { position: static; display: flex; justify-content: space-between; align-items: center; gap: 8px; background: none; border: 0; font-size: 14px; }
.thin .hd span { display: flex; align-items: center; gap: 8px; min-width: 0; }
.thin .nm { white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
.thin .bar { display: flex; height: 8px; gap: 2px; background: var(--surface-2); border-radius: 999px; }
.thin .bar i { display: block; height: 100%; border-radius: 999px; }

/* tiles de situação */
.tiles { display: grid; grid-template-columns: repeat(auto-fit, minmax(110px, 1fr)); gap: 10px; }
.tile { border-radius: 12px; padding: 14px; display: flex; flex-direction: column; gap: 4px; color: var(--ink-h); background: var(--surface-2); }
a.tile:hover { text-decoration: none; box-shadow: inset 0 0 0 1px var(--border); }
.tile span { font-size: 13px; font-weight: 600; color: var(--ink-2); }
.tile b { font-family: var(--f-display); font-size: 28px; font-weight: 800; }
.tile.crit { background: var(--sev-Critico-bg); } .tile.crit span { color: var(--sev-Critico-ink); }
.tile.med { background: var(--sev-Medio-bg); } .tile.med span { color: var(--sev-Medio-ink); }
.tile.coleta { background: var(--primary-soft); } .tile.coleta span { color: #2453C0; }
.tile.line { background: #fff; box-shadow: inset 0 0 0 1px var(--line); }
.rbar { display: grid; grid-template-columns: 130px minmax(0, 1fr) 36px; align-items: center; gap: 12px; font-size: 14px; }
.rbar span:first-child { color: #373d42; }
.rbar .tr { height: 10px; border-radius: 999px; background: var(--primary-soft); }
.rbar .tr i { display: block; height: 100%; border-radius: 999px; background: var(--primary); }
.rbar b { text-align: right; }
.infonote { display: flex; gap: 10px; align-items: flex-start; background: var(--surface-2); border-radius: 10px; padding: 12px 14px; font-size: 13px; color: var(--ink-2); line-height: 1.45; margin-top: 14px; }
.infonote svg { flex: none; margin-top: 1px; }

/* ===== Gráficos ===== */
.chart { width: 100%; height: auto; display: block; }
.chart text { font-family: var(--f-body); font-size: 11px; fill: var(--ink-4); }
.chart .hov rect.hit { fill: transparent; cursor: pointer; }
.chart .hov:hover rect.hit { fill: rgba(55,61,66,.05); }
.chart .hov line.x { stroke: var(--ink-4); stroke-dasharray: 2 3; opacity: 0; }
.chart .hov:hover line.x { opacity: 1; }
.cols { display: flex; gap: 10px; }
.cols .yax { display: flex; flex-direction: column; justify-content: space-between; height: 200px; font-size: 11px; color: var(--ink-4); text-align: right; width: 26px; flex: none; }
.cols .plot { flex: 1; min-width: 0; }
.cols .bars { height: 200px; display: flex; align-items: flex-end; gap: 8px; border-bottom: 1px solid var(--border); background-image: linear-gradient(var(--line-2) 1px, transparent 1px); background-size: 100% 50px; }
.cols .bars button { flex: 1; min-width: 0; height: 100%; display: flex; flex-direction: column-reverse; justify-content: flex-start; padding: 0; border: 0; background: transparent; cursor: pointer; transition: opacity .3s ease-out; border-radius: 4px; }
.cols .bars button.dim { opacity: .35; }
.cols .bars button.sel { outline: 2px solid var(--primary); outline-offset: 3px; }
.cols .bars button i { display: block; width: 100%; }
.cols .bars button i + i { border-bottom: 2px solid #fff; }
.cols .bars button i:last-child { border-radius: 4px 4px 0 0; }
.cols .xax { display: flex; gap: 8px; height: 22px; align-items: flex-end; }
.cols .xax span { flex: 1; min-width: 0; font-size: 11px; color: var(--ink-4); text-align: center; white-space: nowrap; }
.detail { background: var(--surface-2); border-radius: 12px; padding: 14px 16px; display: flex; flex-wrap: wrap; gap: 8px 24px; align-items: center; font-size: 14px; margin-top: 16px; }
.detail strong { color: var(--ink-h); }
.detail .c { color: var(--sev-Critico-ink); font-weight: 600; }
.detail a { margin-left: auto; }

/* ===== Tabelas ===== */
.tbl-wrap { overflow-x: auto; }
table.tbl { width: 100%; border-collapse: collapse; font-size: 14px; }
.tbl th { text-align: left; font-size: 11px; font-weight: 700; color: var(--ink-3); text-transform: uppercase; letter-spacing: .06em; padding: 10px 12px; border-bottom: 1px solid var(--line); white-space: nowrap; background: #fff; }
.tbl td { padding: 12px; border-bottom: 1px solid var(--line); vertical-align: top; }
.tbl td.num, .tbl th.num { text-align: right; }
.tbl tr.click { cursor: pointer; }
.tbl tr.click:hover td { background: var(--surface-2); }
.tbl tr.sel td { background: var(--primary-soft); }
.tbl .sub { display: block; font-size: 12px; color: var(--ink-3); margin-top: 2px; }

/* ===== Abas ===== */
.tabs { display: flex; gap: 4px; border-bottom: 1px solid var(--line); margin-bottom: 20px; overflow-x: auto; }
.tabs a { padding: 10px 14px; color: var(--ink-2); border-bottom: 2px solid transparent; margin-bottom: -1px; white-space: nowrap; font-weight: 600; font-size: 14px; }
.tabs a:hover { text-decoration: none; color: var(--ink-h); }
.tabs a[aria-current="page"] { color: var(--ink-h); border-bottom-color: var(--primary); font-weight: 700; }
.tabs .n { font-size: 12px; font-weight: 600; color: var(--ink-3); margin-left: 6px; background: var(--surface-2); border-radius: 999px; padding: 1px 7px; }

/* ===== Alertas: lista + gaveta ===== */
.split { display: grid; grid-template-columns: minmax(0, 1fr) 400px; gap: 16px; align-items: start; }
.drawer { position: sticky; top: 92px; max-height: calc(100vh - 110px); overflow: auto; }
.drawer .close { display: none; }
.pager { display: flex; align-items: center; gap: 8px; justify-content: flex-end; margin-top: 12px; font-size: 13px; color: var(--ink-3); }
.pager a, .pager span.off { padding: 6px 12px; border-radius: 8px; background: #fff; box-shadow: inset 0 0 0 1px var(--border); }
.pager span.off { opacity: .45; }
.toolbar { display: flex; gap: 10px; flex-wrap: wrap; align-items: center; margin-bottom: 14px; }
.toolbar input, .toolbar select { height: 42px; border: 1px solid var(--border); border-radius: 10px; background: #fff; padding: 0 12px; font-size: 14px; }
.btn { height: 42px; border: 1px solid var(--border); border-radius: 10px; background: #fff; padding: 0 14px; cursor: pointer; color: var(--ink); font-weight: 600; display: inline-flex; align-items: center; gap: 6px; }
.btn:hover { border-color: var(--primary); text-decoration: none; }

/* Evidência */
.ev dl { display: grid; grid-template-columns: 82px minmax(0, 1fr); gap: 10px 12px; margin: 14px 0; font-size: 14px; }
.ev dt { color: var(--ink-3); font-size: 13px; }
.ev dd { margin: 0; }
.ev h3 { font-size: 15px; }
.chain { list-style: none; padding: 0; margin: 10px 0 0; display: grid; gap: 8px; }
.chain li { border-radius: 10px; padding: 10px 12px 10px 14px; background: var(--surface-2); box-shadow: inset 3px 0 0 var(--bar); font-size: 13px; }
.chain li.Critico { box-shadow: inset 3px 0 0 var(--sev-Critico); }
.chain li.Alto { box-shadow: inset 3px 0 0 var(--sev-Alto); }
.chain li.Medio { box-shadow: inset 3px 0 0 var(--sev-Medio); }
.chain li.Revisar { box-shadow: inset 3px 0 0 var(--sev-Revisar); }
.chain b { display: flex; flex-wrap: wrap; gap: 6px; align-items: center; margin-bottom: 4px; color: var(--ink-h); }
.chain .acao { margin-top: 4px; color: var(--ink-2); }
.note { background: var(--surface-2); border-radius: 10px; padding: 12px 14px; font-size: 13px; color: var(--ink-2); line-height: 1.45; }
.linkrow { display: flex; gap: 16px; flex-wrap: wrap; margin-top: 14px; font-size: 13px; }

/* Listas de eventos */
.alist { display: flex; flex-direction: column; }
.alist a { display: flex; gap: 12px; align-items: center; padding: 11px 0; border-top: 1px solid var(--line); color: var(--ink); font-weight: 400; }
.alist a:hover { text-decoration: none; }
.alist a:hover .what b { text-decoration: underline; }
.alist .aico { width: 36px; height: 36px; flex: none; border-radius: 10px; background: var(--sev-Critico-bg); color: var(--sev-Critico); display: grid; place-items: center; }
.alist .aico svg { width: 16px; height: 16px; fill: none; stroke: currentColor; stroke-width: 2; stroke-linecap: round; }
.alist .what { flex: 1; min-width: 0; display: flex; flex-direction: column; gap: 2px; }
.alist .what b { font-size: 14px; font-weight: 700; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
.alist .what small { font-size: 12px; color: var(--ink-3); white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
.alist .when { font-size: 12px; color: var(--ink-3); flex: none; }

/* Investigar */
.bigsearch { position: relative; max-width: 640px; }
.bigsearch label { display: flex; align-items: center; gap: 10px; background: #fff; border: 1px solid var(--border); border-radius: 12px; padding: 0 16px; height: 52px; }
.bigsearch label:focus-within { border-color: var(--primary); }
.bigsearch input { border: 0; outline: none; background: transparent; width: 100%; font-size: 16px; }
.bigsearch .sugg { top: 56px; }
.qchips { display: flex; gap: 8px; flex-wrap: wrap; margin-top: 12px; align-items: center; font-size: 13px; color: var(--ink-3); }
.qchips a { background: #fff; box-shadow: inset 0 0 0 1px var(--border); border-radius: 999px; padding: 4px 12px; color: var(--ink); font-weight: 600; }
.flows { display: grid; grid-template-columns: repeat(3, minmax(0, 1fr)); gap: 16px; }
details.grp { border-radius: 12px; margin-bottom: 10px; background: #fff; box-shadow: var(--shadow); }
details.grp > summary { cursor: pointer; padding: 12px 14px; display: flex; gap: 10px; align-items: center; list-style: none; flex-wrap: wrap; }
details.grp > summary::-webkit-details-marker { display: none; }
details.grp > summary::before { content: "▸"; color: var(--ink-3); transition: transform .15s; }
details.grp[open] > summary::before { transform: rotate(90deg); }
details.grp > summary .cnt { margin-left: auto; font-size: 13px; color: var(--ink-3); display: flex; gap: 8px; align-items: center; flex-wrap: wrap; }
.tl { list-style: none; margin: 0; padding: 0 14px 10px; }
.tl li { display: grid; grid-template-columns: 110px minmax(0, 1fr) auto; gap: 12px; padding: 10px 0; border-top: 1px solid var(--line); font-size: 13px; align-items: center; }
.tl .d { font-size: 12px; color: var(--ink-3); }
.tl .x { display: flex; gap: 6px; align-items: center; flex-wrap: wrap; justify-content: flex-end; }

.empty-state { padding: 40px; text-align: center; color: var(--ink-3); }
#tip { position: fixed; z-index: 50; pointer-events: none; background: var(--ink-h); color: #fff; font-size: 12px; padding: 10px 12px; border-radius: 10px; max-width: 280px; line-height: 1.5; box-shadow: 0 10px 24px rgba(0,0,0,.2); }
#tip .row { display: flex; justify-content: space-between; gap: 14px; }
#tip i { display: inline-block; width: 8px; height: 8px; border-radius: 2px; margin-right: 6px; }
footer { padding: 0 32px 32px; font-size: 12px; color: var(--ink-3); max-width: 1320px; }

/* ===== Responsivo ===== */
@media (max-width: 1180px) {
  .split { grid-template-columns: minmax(0, 1fr); }
  .drawer { position: fixed; inset: 0; max-height: none; z-index: 40; border-radius: 0; }
  .drawer .close { display: inline-flex; }
  .drawer:not(.open) { display: none; }
  .g-3-1 { grid-template-columns: minmax(0, 1fr); }
}
@media (max-width: 900px) {
  .g-2, .flows { grid-template-columns: minmax(0, 1fr); }
  .app { grid-template-columns: minmax(0, 1fr); }
  .side { position: static; height: auto; flex-direction: row; align-items: center; gap: 14px; padding: 12px 16px; overflow-x: auto; }
  .brand-t small, .side > div:not(.brand), .disc { display: none; }
  .logo-svg { width: 110px; }
  .nav { flex-direction: row; }
  .nav a { padding: 8px 12px; font-size: 14px; }
  .top-in { padding: 12px 16px; }
  .top-in .ctx { display: none; }
  .search { flex: 1 1 100%; }
  main { padding: 20px 16px 40px; }
  footer { padding: 0 16px 24px; }
  .head h1 { font-size: 28px; }
}
@media (max-width: 560px) {
  .kpis { grid-template-columns: minmax(0, 1fr); }
  .hb { grid-template-columns: minmax(96px, 40%) minmax(0, 1fr) 44px; }
  .tl li { grid-template-columns: 1fr; gap: 4px; }
  .tl .x { justify-content: flex-start; }
  .rbar { grid-template-columns: 100px minmax(0, 1fr) 30px; }
  .hero { padding: 20px; }
  .cols .bars { gap: 3px; }
  .fpanel label, .fpanel select, .fpanel input { width: 100%; }
}

/* ===== v5: modal, rotina da fila, paleta limpa (azul/cinza; vermelho só para alerta em aberto) ===== */
:root { --alert: #C62828; --alert-bg: #FDECEC; --alert-ink: #A61B1B; --st-aberto: #C62828; --st-analise: #5F96EE; --st-tratado: #C9D1DD; }
.nav .badge { background: var(--alert); }
.hero .flag { background: var(--alert); }
.hero .flag.ok { background: var(--primary); }
.tile.crit { background: var(--alert-bg); } .tile.crit span { color: var(--alert-ink); }
.tile.med { background: var(--primary-soft); } .tile.med span { color: var(--ok-ink); }
.alist .aico { background: var(--alert-bg); color: var(--alert); }
.meta.fora { background: #E8EFFC; color: #1A3170; }
.meta.dentro { background: var(--surface-2); color: var(--ink-2); box-shadow: inset 0 0 0 1px var(--line); }
.risk.Critico { background: #1A3170; color: #fff; }
.risk.Alto { background: #DCE5F7; color: #1A3170; }
.risk.Medio { background: #EEF4FD; color: #2F5FCC; }
.risk.Baixo { background: var(--surface-2); color: var(--ink-2); box-shadow: inset 0 0 0 1px var(--line); }
.risk.Revisar { background: #EEF0F4; color: #4A5565; box-shadow: inset 0 0 0 1px #D3DAE6; }
.st.ok { background: var(--primary-soft); color: #1E4FB5; }
.st.cond { background: var(--surface-2); color: var(--ink-2); box-shadow: inset 0 0 0 1px var(--border); }
.st.nao { background: #262F3D; color: #fff; }
.hb .v em { color: #1A3170; }
.detail .c { color: #1A3170; }
.fbtn .n { background: var(--primary); }
.fpanel .fsearch { position: relative; flex: 1 1 320px; }
.fpanel .fsearch input { width: 100%; }
.fpanel .fsearch .sugg { top: 66px; }

/* Modal */
#modal[hidden] { display: none; }
#modal { position: fixed; inset: 0; z-index: 60; display: flex; align-items: flex-start; justify-content: center; padding: 40px 20px; overflow-y: auto; }
#modal .mback { position: fixed; inset: 0; background: rgba(19, 23, 26, .45); }
#modal .mbox { position: relative; background: var(--bg); border-radius: 20px; width: min(980px, 100%); box-shadow: 0 24px 60px rgba(19,23,26,.3); }
#modal .mhead { display: flex; align-items: center; gap: 10px; padding: 16px 20px; background: #fff; border-radius: 20px 20px 0 0; border-bottom: 1px solid var(--line); position: sticky; top: 0; z-index: 2; }
#modal .mkind { font-size: 12px; font-weight: 700; letter-spacing: .08em; text-transform: uppercase; color: var(--ink-3); }
#modal .mx { margin-left: auto; width: 36px; height: 36px; border-radius: 10px; border: 1px solid var(--border); background: #fff; cursor: pointer; font-size: 20px; line-height: 1; color: var(--ink-2); }
#modal .mbody { padding: 22px 24px 26px; }
#modal .mtitle h2 { font-size: 26px; font-weight: 800; }
#modal .mtitle p { margin: 6px 0 18px; color: var(--ink-2); display: flex; gap: 8px; flex-wrap: wrap; align-items: center; }
#modal .kpis { grid-template-columns: repeat(auto-fit, minmax(150px, 1fr)); }
#modal .kpi { padding: 16px; box-shadow: var(--shadow); }
#modal .kpi .val { font-size: 30px; }
#modal .flows { grid-template-columns: repeat(auto-fit, minmax(240px, 1fr)); }
#modal .hb { grid-template-columns: minmax(0, 1.4fr) minmax(0, 1fr) 32px; }
#modal .mfoot { display: flex; gap: 16px; flex-wrap: wrap; margin-top: 16px; font-size: 13px; }

/* Rotina da fila */
.rotina { display: grid; grid-template-columns: repeat(3, minmax(0, 1fr)); gap: 12px; margin-bottom: 20px; }
.rotina div { background: #fff; border-radius: 14px; box-shadow: var(--shadow); padding: 14px 16px; font-size: 13px; color: var(--ink-2); line-height: 1.45; }
.rotina b { display: flex; align-items: center; gap: 8px; font-size: 14px; color: var(--ink-h); margin-bottom: 4px; }
.rotina b i { width: 10px; height: 10px; border-radius: 50%; display: inline-block; }
.rotina .seta { color: var(--ink-4); }

/* Tratamento no painel lateral */
.trat { margin-top: 18px; padding-top: 16px; border-top: 1px solid var(--line); }
.trat h3 { font-size: 15px; margin-bottom: 10px; }
.steps { display: flex; gap: 6px; margin-bottom: 14px; }
.steps span { flex: 1; text-align: center; font-size: 12px; font-weight: 700; padding: 6px 4px; border-radius: 8px; background: var(--surface-2); color: var(--ink-3); }
.steps span.done { background: var(--primary-soft); color: #1E4FB5; }
.steps span.cur { background: var(--primary); color: #fff; }
.steps span.cur.aberto { background: var(--alert); }
.trat label { display: flex; flex-direction: column; gap: 4px; font-size: 12px; font-weight: 600; color: var(--ink-2); margin-bottom: 10px; }
.trat select, .trat textarea { border: 1px solid var(--border); border-radius: 10px; background: #fff; padding: 8px 10px; font-size: 14px; font-family: inherit; }
.trat textarea { min-height: 70px; resize: vertical; }
.trat .acts { display: flex; gap: 8px; flex-wrap: wrap; }
.btn.primary { background: var(--primary); border-color: var(--primary); color: #fff; }
.btn.primary:hover { background: #2F5FCC; color: #fff; }
.btn:disabled { opacity: .45; cursor: not-allowed; }
.trat .res { display: grid; grid-template-columns: 90px minmax(0, 1fr); gap: 6px 10px; font-size: 13px; margin-bottom: 12px; }
.trat .res dt { color: var(--ink-3); } .trat .res dd { margin: 0; }
.hist2 { list-style: none; padding: 0; margin: 10px 0 0; font-size: 12px; color: var(--ink-2); border-left: 2px solid var(--line); }
.hist2 li { padding: 2px 0 8px 12px; }
.hist2 b { color: var(--ink-h); }
.demo { font-size: 11.5px; color: var(--ink-3); margin-top: 10px; }
@media (max-width: 900px) { .rotina { grid-template-columns: minmax(0, 1fr); } #modal { padding: 0; } #modal .mbox { border-radius: 0; min-height: 100vh; } #modal .mhead { border-radius: 0; } }
.card-h .legend { grid-column: 1 / -1; grid-row: auto; justify-self: start; margin-top: 8px; white-space: normal; font-weight: 500; }

/* logo vertical (pacote GerencIA-logo-A, versão negativo); no celular, só o símbolo */
.brand { align-items: center; gap: 0; padding: 4px 0 8px; }
.logo-v { width: 196px; height: auto; display: block; }
.logo-m { display: none; width: 34px; height: 34px; }
@media (max-width: 900px) { .brand { padding: 0; } .logo-v { display: none; } .logo-m { display: block; } }

/* ===== v7: menu lateral enxuto e proporcional à largura da janela ===== */
.app { grid-template-columns: clamp(176px, 15vw, 220px) minmax(0, 1fr); }
.side { padding: clamp(16px, 1.6vw, 22px) clamp(10px, 1vw, 14px); gap: clamp(14px, 1.6vw, 22px); }
.brand { align-items: center; gap: 6px; padding: 2px 0 4px; }
.logo-v { width: clamp(88px, 7.5vw, 116px); }
.brand .tag { font-size: clamp(10px, .75vw, 11px); line-height: 1.3; color: var(--side-muted); text-align: center; letter-spacing: .01em; }
.nav { gap: 2px; }
.nav a { gap: 10px; padding: clamp(7px, .6vw, 9px) 10px; font-size: clamp(12.5px, .9vw, 13.5px); border-radius: 8px; }
.nav a svg { width: 16px; height: 16px; }
.nav .badge { font-size: 11px; padding: 1px 7px; }
.nav .subnav { margin-left: 26px; }
.nav .subnav a { font-size: clamp(12px, .85vw, 13px); padding: 6px 10px; }
.side-sec { font-size: 10px; letter-spacing: .12em; margin-bottom: 8px; padding: 0 2px; }
.fontes { padding: 10px; gap: 7px; border-radius: 10px; }
.fontes a { font-size: 12.5px; }
.fontes a b { font-size: 14px; }
.fontes .cap { font-size: 11px; }
.fbar { height: 4px; }
.disc { font-size: 11px; }
/* conteúdo acompanha a largura da janela */
main { padding: clamp(18px, 2.2vw, 28px) clamp(16px, 2.4vw, 32px) 48px; }
.head h1 { font-size: clamp(24px, 2.4vw, 34px); }
.hero { padding: clamp(18px, 2vw, 28px); gap: clamp(14px, 1.6vw, 24px); }
.hero h2 { font-size: clamp(20px, 1.9vw, 28px); }
.hero .m .v b { font-size: clamp(28px, 2.6vw, 40px); }
.kpi .val { font-size: clamp(28px, 2.6vw, 40px); }
.kpis { grid-template-columns: repeat(auto-fit, minmax(min(100%, 240px), 1fr)); }
@media (max-width: 1100px) { .g-3-1 { grid-template-columns: minmax(0, 1fr); } .split { grid-template-columns: minmax(0, 1fr); } }
@media (max-width: 900px) { .app { grid-template-columns: minmax(0, 1fr); } .side { padding: 10px 14px; gap: 12px; } .brand .tag { display: none; } }

/* ===== Alertas em quadro (kanban) ===== */
.kanban { display: grid; grid-template-columns: repeat(3, minmax(0, 1fr)); gap: 16px; align-items: start; }
.kcol { background: #E9EDF3; border-radius: 16px; padding: 12px; min-height: 220px; transition: box-shadow .15s, background .15s; }
.kcol.over { background: #E1E9F8; box-shadow: inset 0 0 0 2px var(--primary); }
.kcol header { display: flex; align-items: center; gap: 8px; padding: 4px 6px 2px; }
.kcol header i { width: 10px; height: 10px; border-radius: 50%; flex: none; }
.kcol header h3 { font-size: 15px; }
.kcol header .n { margin-left: auto; font-size: 12px; font-weight: 700; background: #fff; border-radius: 999px; padding: 2px 9px; color: var(--ink-2); }
.kcol .ksub { font-size: 12px; color: var(--ink-3); padding: 0 6px 10px; }
.kcards { display: flex; flex-direction: column; gap: 8px; }
.kcard { background: #fff; border-radius: 12px; box-shadow: var(--shadow), 0 1px 2px rgba(19,23,26,.05); padding: 12px; cursor: grab; display: flex; flex-direction: column; gap: 6px; }
.kcard:hover { box-shadow: inset 0 0 0 1px var(--border), 0 6px 14px -8px rgba(19,23,26,.25); }
.kcard:active { cursor: grabbing; }
.kcard.drag { opacity: .45; }
.kcard:focus-visible { outline: 2px solid var(--primary); outline-offset: 2px; }
.kc-top { display: flex; gap: 6px; align-items: center; }
.kc-id { margin-left: auto; font-size: 11px; color: var(--ink-4); }
.kcard b { font-size: 14px; color: var(--ink-h); line-height: 1.3; }
.kc-sub { font-size: 12px; color: var(--ink-3); }
.kc-foot { display: flex; justify-content: space-between; gap: 8px; font-size: 11.5px; color: var(--ink-2); border-top: 1px solid var(--line); padding-top: 6px; margin-top: 2px; }
.kmore { margin-top: 8px; width: 100%; border: 0; background: transparent; color: var(--primary); font-weight: 700; cursor: pointer; padding: 8px; border-radius: 8px; font-size: 13px; }
.kmore:hover { background: #fff; }
.kempty { text-align: center; color: var(--ink-3); font-size: 13px; padding: 24px 0; margin: 0; }
.malerta { align-items: start; }
.malerta .trat { margin-top: 0; padding-top: 0; border-top: 0; }
@media (max-width: 900px) { .kanban { grid-template-columns: minmax(0, 1fr); } }
.kord { display: flex; align-items: center; gap: 6px; padding: 0 6px 10px; font-size: 12px; color: var(--ink-3); }
.kord select { flex: 1; min-width: 0; height: 30px; border: 1px solid var(--border); border-radius: 8px; background: #fff; padding: 0 6px; font-size: 12px; color: var(--ink); }

/* ===== Cadastros ===== */
.src.cadastro { background: #EEF0F4; color: #3D4B5E; box-shadow: inset 0 0 0 1px #C9D1DD; }
.mform { width: min(560px, 100%); }
.cform label { display: flex; flex-direction: column; gap: 5px; font-size: 13px; font-weight: 600; color: var(--ink-2); margin-bottom: 12px; }
.cform input, .cform select, .cform textarea { height: 42px; border: 1px solid var(--border); border-radius: 10px; background: #fff; padding: 0 12px; font-size: 14px; font-family: inherit; color: var(--ink); }
.cform textarea { height: auto; min-height: 76px; padding: 10px 12px; resize: vertical; }
.cform input:focus, .cform select:focus, .cform textarea:focus { outline: 2px solid var(--primary); outline-offset: -1px; }
.cform .req { color: var(--alert); }
.cform .acts { display: flex; gap: 8px; justify-content: flex-end; margin-top: 6px; }
.cerr { background: var(--alert-bg); color: var(--alert-ink); border-radius: 10px; padding: 10px 12px; font-size: 13px; margin: 0 0 12px; }

/* ===== Usuário logado (menu lateral) ===== */
.usuario { display: flex; align-items: center; gap: 8px; padding: 10px; border-radius: 10px; background: rgba(255,255,255,.06); border: 1px solid rgba(255,255,255,.1); }
.usuario:empty { display: none; }
.u-av { width: 28px; height: 28px; border-radius: 50%; background: var(--primary); color: #fff; display: grid; place-items: center; font-size: 11px; font-weight: 700; flex: none; }
.u-tx { min-width: 0; display: flex; flex-direction: column; line-height: 1.25; }
.u-tx b { font-size: 12.5px; color: #fff; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
.u-tx span { font-size: 11px; color: var(--side-faint); white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
.u-sair { margin-left: auto; border: 0; background: transparent; color: var(--side-muted); font-size: 12px; cursor: pointer; padding: 4px 6px; border-radius: 6px; }
.u-sair:hover { background: rgba(255,255,255,.1); color: #fff; }

/* ===== Tela de login ===== */
body.bloq .app { display: none; }
#login { position: fixed; inset: 0; z-index: 80; background: var(--bg); display: grid; place-items: center; padding: 20px; overflow-y: auto; }
.lg-box { display: grid; grid-template-columns: minmax(0, 1fr) minmax(0, 1fr); width: min(860px, 100%); background: #fff; border-radius: 20px; overflow: hidden; box-shadow: 0 24px 60px -20px rgba(19,23,26,.25); }
.lg-brand { background: var(--side); color: #fff; padding: 48px 36px; display: flex; flex-direction: column; align-items: center; justify-content: center; text-align: center; gap: 18px; }
.lg-brand .logo-h { width: min(260px, 100%); height: auto; display: block; }
.lg-brand p { margin: 0; color: var(--side-muted); font-size: 14px; line-height: 1.5; max-width: 26ch; }
.lg-form { padding: 44px 40px; display: flex; flex-direction: column; gap: 14px; }
.lg-form h1 { font-size: 26px; margin-bottom: 4px; }
.lg-form label { display: flex; flex-direction: column; gap: 6px; font-size: 13px; font-weight: 600; color: var(--ink-2); }
.lg-form input[type=email], .lg-form input[type=password] { height: 44px; border: 1px solid var(--border); border-radius: 10px; padding: 0 12px; font-size: 15px; }
.lg-form input:focus { outline: 2px solid var(--primary); outline-offset: -1px; }
.lg-form .lg-chk { flex-direction: row; align-items: center; gap: 8px; font-weight: 500; }
.lg-form .btn.primary { height: 46px; justify-content: center; font-size: 15px; }
.lg-form .cerr { margin: 0; }
@media (max-width: 700px) { .lg-box { grid-template-columns: minmax(0, 1fr); } .lg-brand { padding: 28px; } .lg-brand .logo-h { width: 200px; } .lg-form { padding: 28px 22px; } }
@media (max-width: 900px) { .side > div.usuario { display: flex; margin-left: auto; padding: 4px; background: none; border: 0; } .u-tx { display: none; } }
.lg-brand .logo-h { width: min(300px, 100%); }
.side > .usuario { margin-top: auto; }

/* ===== Acompanhamento v2: indicadores enxutos, sem quebra no desktop ===== */
.kpis4 { display: grid; grid-template-columns: repeat(4, minmax(0, 1fr)); gap: 16px; margin-bottom: 16px; }
.kpi2 { gap: 6px; padding: 20px 22px; }
.kpi2 .lab { white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
.kpi2 .val { font-size: clamp(30px, 2.4vw, 38px); margin: 2px 0 4px; }
.kpi2 .foot { font-size: 13px; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; display: block; }
.metaline { font-size: 12.5px; font-weight: 600; }
.metaline.fora { color: #1A3170; }
.metaline.ok { color: var(--ink-3); }
.g-1-2 { grid-template-columns: minmax(320px, 1fr) minmax(0, 2fr); }
.tiles4 { display: grid; grid-template-columns: repeat(2, minmax(0, 1fr)); gap: 10px; }
.tiles4 .tile { padding: 12px 14px; }
.tiles4 .tile b { font-size: 26px; line-height: 1.1; }
.tiles4 .tile small { font-size: 12.5px; font-weight: 600; color: var(--ink-2); }
.hbs { grid-template-columns: minmax(120px, 34%) minmax(0, 1fr) 104px; }
.hbs .v { white-space: nowrap; }
.hbs .v small, .thin b small { font-weight: 600; font-size: 12px; color: var(--ink-3); margin-left: 4px; }
.card-h .hint { white-space: normal; }
@media (max-width: 1100px) { .kpis4 { grid-template-columns: repeat(2, minmax(0, 1fr)); } .g-1-2 { grid-template-columns: minmax(0, 1fr); } }
.semanal .cols .bars, .semanal .cols .yax { height: 300px; }
.semanal .cols .bars { background-size: 100% 75px; }
.linhaA { align-items: stretch; }
.pilha { display: flex; flex-direction: column; gap: 16px; min-width: 0; }
.tiles4.linha { grid-template-columns: repeat(4, minmax(0, 1fr)); }
.tiles4.linha .tile { padding: 10px 12px; }
.tiles4.linha .tile b { font-size: 22px; }
.semanal { display: flex; flex-direction: column; }
.semanal .cols { flex: 1; }
.semanal .cols .bars, .semanal .cols .yax { height: 100%; min-height: 260px; }
.semanal .cols .plot { display: flex; flex-direction: column; }
.semanal .cols .bars { flex: 1; }
.rsel { grid-column: 1 / -1; display: flex; flex-wrap: wrap; gap: 6px; margin-top: 8px; }
.rsel button { display: inline-flex; align-items: center; gap: 6px; border: 1px solid var(--border); background: #fff; border-radius: 999px; padding: 4px 10px; font-size: 12px; font-weight: 600; color: var(--ink-3); cursor: pointer; }
.rsel button i { width: 9px; height: 9px; border-radius: 3px; display: inline-block; opacity: .35; }
.rsel button[aria-pressed="true"] { color: var(--ink-h); border-color: var(--ink-4); background: var(--surface-2); }
.rsel button[aria-pressed="true"] i { opacity: 1; }
.cols .bars button.sel-semana { outline: 2px solid var(--primary); outline-offset: 3px; }
.cols .bars.com-sel button:not(.sel-semana) { opacity: .4; }
.thin.cols2 { display: grid; grid-template-columns: repeat(2, minmax(0, 1fr)); column-gap: 32px; row-gap: 14px; }
.thin .dist { display: flex; flex-wrap: nowrap; margin-left: 6px; gap: 4px 12px; font-size: 11.5px; font-weight: 500; color: var(--ink-3); }
.thin .dist span { display: inline-flex; align-items: center; gap: 4px; }
.thin .dist i { width: 7px; height: 7px; border-radius: 2px; display: inline-block; }
@media (max-width: 1100px) { .thin.cols2 { grid-template-columns: minmax(0, 1fr); } }
/* etiqueta (status, classificação) sempre ao lado do nome */
.hb .l { flex-direction: row; align-items: center; gap: 8px; }
.chain b { flex-wrap: nowrap; align-items: flex-start; }
.chain b .risk { flex: none; margin-top: 1px; }
#cad-novo, #cad-exp { white-space: nowrap; }
</style>

00000000002H491.496V106.72000000000001Q492.01599999999996 104.32800000000002 492.84799999999996 102.24800000000002Q495.032 96.424 499.60799999999995 93.51200000000001Q504.18399999999997 90.60000000000002 510.736 90.60000000000002H511.46399999999994Q521.448 90.60000000000002 526.7 97.10000000000002Q531.952 103.60000000000002 531.952 116.80800000000002V149.36H515.312V115.87200000000001Q515.312 111.29600000000002 512.608 108.38400000000001Q509.904 105.47200000000001 505.328 105.47200000000001Q500.64799999999997 105.47200000000001 497.788 108.436Q494.928 111.4 494.928 116.18400000000001V149.36Z"/><path fill="#FFFFFF" d="M568.68 151.336Q561.2959999999999 151.336 555.8359999999999 148.892Q550.3759999999999 146.448 546.7359999999999 142.288Q543.0959999999999 138.12800000000001 541.328 132.876Q539.56 127.62400000000001 539.56 122.00800000000001V120.03200000000001Q539.56 114.20800000000001 541.4319999999999 108.852Q543.3039999999999 103.49600000000001 546.944 99.33600000000001Q550.584 95.17600000000002 556.0439999999999 92.78400000000002Q561.5039999999999 90.39200000000002 568.5759999999999 90.39200000000002Q576.2719999999999 90.39200000000002 582.1999999999999 93.35600000000002Q588.1279999999999 96.32000000000002 591.664 101.62400000000002Q595.1999999999999 106.92800000000003 595.6159999999999 113.79200000000002H579.2879999999999Q578.8719999999998 109.94400000000002 576.2199999999998 107.29200000000002Q573.5679999999999 104.64000000000001 568.5759999999999 104.64000000000001Q564.4159999999999 104.64000000000001 561.6599999999999 106.72000000000001Q558.9039999999999 108.80000000000001 557.5519999999999 112.44000000000001Q556.1999999999999 116.08000000000001 556.1999999999999 121.07200000000002Q556.1999999999999 125.64800000000001 557.4479999999999 129.34Q558.6959999999999 133.032 561.4519999999999 135.06Q564.2079999999999 137.08800000000002 568.68 137.08800000000002Q572.0079999999999 137.08800000000002 574.348 135.89200000000002Q576.6879999999999 134.69600000000003 578.0919999999999 132.56400000000002Q579.4959999999999 130.43200000000002 579.8079999999999 127.62400000000001H596.0319999999999Q595.7199999999999 134.69600000000003 592.0799999999999 140.05200000000002Q588.4399999999999 145.40800000000002 582.4079999999999 148.372Q576.3759999999999 151.336 568.68 151.336Z"/><path fill="#7DB3F7" d="M604.7839999999999 149.36V73.44000000000001H621.8399999999999V149.36Z"/><path fill="#7DB3F7" d="M628.9279999999999 149.36 653.992 73.44000000000001H681.5519999999999L707.5519999999999 149.36H689.872L683.7359999999999 130.536H652.0159999999998L645.9839999999999 149.36ZM679.0559999999999 116.39200000000002 669.5919999999999 87.37600000000002H665.7439999999999L656.4879999999999 116.39200000000002Z"/><text x="122.60" y="192" font-size="24" font-family="Red Hat Text, system-ui, sans-serif" font-weight="700" fill="#B8C2D1" textLength="584.95" lengthAdjust="spacing">RASTREABILIDADE E GOVERNANÇA</text></svg></template>

<script src="dados.js"></script>
<script>
"use strict";
const E = window.EspIA;
if (!E) {
  document.getElementById('main').innerHTML = '<div class="card empty-state">Não encontrei o <b>dados.js</b> ao lado deste arquivo. Mantenha os arquivos do pacote na mesma pasta.</div>';
  throw new Error('dados.js ausente');
}
// ---------------- cadastros feitos no painel ----------------
// Demonstração: ficam salvos neste navegador (localStorage) e entram no painel junto com os da planilha.
// Para levar ao pipeline, use "Exportar cadastros" (JSON) na aba Governança → Cadastros.
const CKEY = 'gerencia-cadastros-v1';
const CAD = { classificacoes: [], ferramentas: [], usuarios: [], tipos: [], regras: [], fontes: [] };
try { const g = JSON.parse(localStorage.getItem(CKEY) || '{}') || {}; Object.keys(CAD).forEach(k => { if (Array.isArray(g[k])) CAD[k] = g[k]; }); } catch (e) { /* sem armazenamento: só os da planilha */ }
const salvarCad = () => { try { localStorage.setItem(CKEY, JSON.stringify(CAD)); return true; } catch (e) { return false; } };
CAD.classificacoes.forEach(x => E.politica.classificacoes.push({ ...x, cadastro: true }));
CAD.ferramentas.forEach(x => E.ferramentas.push({ ...x, cadastro: true }));
CAD.usuarios.forEach(x => E.usuarios.push({ ...x, cadastro: true }));
CAD.tipos.forEach(x => E.tipos.push({ ...x, cadastro: true }));
CAD.regras.forEach(x => E.politica.regras.push({ usos_base: 0, usos_principal: 0, usos_total: 0, ...x, cadastro: true }));
CAD.fontes.forEach(x => E.fontes.push({ ...x, cadastro: true }));


// ---------------- constantes ----------------
const RISCOS = ['Crítico', 'Alto', 'Médio', 'Baixo', 'REVISAR'];
const RK = { 'Crítico': 'Critico', 'Alto': 'Alto', 'Médio': 'Medio', 'Baixo': 'Baixo', 'REVISAR': 'Revisar' };
const RORD = { 'Crítico': 0, 'Alto': 1, 'Médio': 2, 'REVISAR': 3, 'Baixo': 4 };
const SENS = ['Crítica', 'Confidencial', 'Interna', 'Pública'];
const SK = { 'Crítica': 'Critica', 'Confidencial': 'Confidencial', 'Interna': 'Interna', 'Pública': 'Publica' };
const STATUS_ALERTA = ['Aberto', 'Em análise', 'Tratado'];
// Metas da aba Indicadores_Atuais da planilha oficial
const META = { naoAprovada: 0.03, critico: 0.01 };
const PER = E.meta.periodo;
const css = (v) => getComputedStyle(document.documentElement).getPropertyValue(v).trim();
const COR = Object.fromEntries(RISCOS.map(r => [r, css('--sev-' + RK[r])]));

// ---------------- índices ----------------
const byId = (arr) => Object.fromEntries(arr.map(x => [x.id, x]));
const FER = byId(E.ferramentas), TIP = byId(E.tipos), USR = byId(E.usuarios), EVT = byId(E.eventos), ALT = byId(E.alertas);
E.eventos.forEach(e => {
  const f = FER[e.ferramenta_id];
  e.naoAprovada = f ? !f.aprovada : false;
  // Fonte: tudo que veio da carga da planilha oficial tem ID EVT-; o resto é Coleta (recebido pelo coletor da GerencIA)
  e.fonte = /^EVT-/.test(e.id) ? 'planilha' : 'coleta';
  e.aoVivo = e.fonte === 'coleta';
  e.sensivel = e.sensibilidade === 'Crítica' || e.sensibilidade === 'Confidencial';
});
E.alertas.forEach(a => {
  const m = (a.ts || '').match(/(\d\d)\/(\d\d)\/(\d{4}) (\d\d:\d\d)/);
  a.data = m ? `${m[3]}-${m[2]}-${m[1]}` : '';
  a.iso = m ? `${a.data}T${m[4]}` : '';
  const ev = EVT[a.evento_id];
  a.ferramenta_id = ev ? ev.ferramenta_id : '';
  a.fonte = ev ? ev.fonte : 'planilha';
  a.informacao_id = ev ? ev.informacao_id : '';
});
const FONTE = {
  planilha: { l: 'Planilha', full: 'Planilha oficial do desafio (carga legada)' },
  coleta: { l: 'Coleta', full: 'Coleta — registrada pelo coletor da GerencIA' },
};
const srcTag = (f) => FONTE[f] ? `<span class="src ${f}" title="${esc(FONTE[f].full)}">${FONTE[f].l}</span>` : '';
const AREAS = [...new Set(E.eventos.map(e => e.area))].sort((a, b) => a.localeCompare(b, 'pt-BR'));

// ---------------- utilidades ----------------
const esc = (s) => String(s ?? '').replace(/[&<>"']/g, c => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;' }[c]));
const num = (n) => Number(n || 0).toLocaleString('pt-BR');
const pct = (x, d = 1) => (isFinite(x) ? (x * 100).toFixed(d).replace('.', ',') : '0') + '%';
const norm = (s) => String(s || '').normalize('NFD').replace(/[\u0300-\u036f]/g, '').toLowerCase();
const dBR = (iso) => iso ? `${iso.slice(8, 10)}/${iso.slice(5, 7)}` : '';
const dtBR = (ts) => ts ? `${ts.slice(8, 10)}/${ts.slice(5, 7)}/${ts.slice(0, 4)} ${ts.slice(11, 16)}` : '';
const riskChip = (r) => r ? `<span class="risk ${RK[r] || ''}">${esc(r)}</span>` : '';
const clsChip = (s) => s ? `<span class="cls ${SK[s] || ''}">${esc(s)}</span>` : '';
const ruleChip = (r) => r ? `<span class="rule">${esc(r)}</span>` : '';
const nomeUsr = (id) => USR[id] ? USR[id].nome : 'não identificado';
function stTag(fid) {
  const f = FER[fid]; if (!f) return '';
  const k = !f.aprovada ? 'nao' : (/condicional|apenas/i.test(f.status) ? 'cond' : 'ok');
  return `<span class="st ${k}" title="${esc(f.status)}">${{ ok: 'Aprovada', cond: 'Condicional', nao: 'Não aprovada' }[k]}</span>`;
}
const tipAttr = (html) => ` data-tip="${esc(html)}"`;
function addDays(iso, n) { const d = new Date(iso + 'T00:00:00Z'); d.setUTCDate(d.getUTCDate() + n); return d.toISOString().slice(0, 10); }
function weekStart(iso) { const d = new Date(iso + 'T00:00:00Z'); const wd = (d.getUTCDay() + 6) % 7; d.setUTCDate(d.getUTCDate() - wd); return d.toISOString().slice(0, 10); }
function niceMax(v) { if (v <= 0) return 1; const p = Math.pow(10, Math.floor(Math.log10(v))); for (const m of [1, 1.2, 1.5, 2, 2.5, 3, 4, 5, 6, 8, 10]) if (m * p >= v) return m * p; return 10 * p; }
const count = (arr, fn) => arr.reduce((m, x) => { const k = fn(x); m[k] = (m[k] || 0) + 1; return m; }, {});

// ---------------- roteamento (hash) ----------------
// Cada tela e cada filtro tem endereço próprio: #/alertas?status=Aberto&area=Financeiro
let route = { path: [], q: {} };
const GF = ['fonte', 'de', 'ate', 'area', 'ferr', 'risco'];   // filtros globais (valem em todas as telas operacionais)
function parseHash() {
  const h = location.hash.replace(/^#/, '') || '/acompanhamento';
  const [p, qs] = h.split('?');
  route.path = p.split('/').filter(Boolean).map(decodeURIComponent);
  if (!route.path.length) route.path = ['acompanhamento'];
  route.q = Object.fromEntries(new URLSearchParams(qs || ''));
}
function href(path, q) {
  const s = new URLSearchParams(Object.entries(q || {}).filter(([, v]) => v !== '' && v != null)).toString();
  return '#/' + path.map(encodeURIComponent).join('/') + (s ? '?' + s : '');
}
const gq = () => Object.fromEntries(GF.filter(k => route.q[k]).map(k => [k, route.q[k]]));
const link = (path, extra) => href(path, { ...gq(), ...(extra || {}) });
function setQ(patch, keepPath = true) {
  const q = { ...route.q, ...patch };
  Object.keys(q).forEach(k => { if (q[k] === '' || q[k] == null) delete q[k]; });
  location.hash = href(keepPath ? route.path : [], q);
}

// ---------------- filtros ----------------
function fEventos(q = route.q) {
  return E.eventos.filter(e =>
    (!q.fonte || e.fonte === q.fonte) && (!q.de || e.data >= q.de) && (!q.ate || e.data <= q.ate) &&
    (!q.area || e.area === q.area) && (!q.ferr || e.ferramenta_id === q.ferr) &&
    (!q.risco || e.risco === q.risco));
}
function fAlertas(q = route.q) {
  return E.alertas.filter(a =>
    (!q.fonte || a.fonte === q.fonte) && (!q.de || a.data >= q.de) && (!q.ate || a.data <= q.ate) &&
    (!q.area || a.area === q.area) && (!q.ferr || a.ferramenta_id === q.ferr) &&
    (!q.risco || a.risco === q.risco));
}
// ---------------- filtros no cabeçalho da página ----------------
let filtrosAbertos = false;
function mountFilters(main) {
  if (route.path[0] === 'governanca') return;
  const head = main.querySelector('.head'); if (!head) return;
  const q = route.q, fim = PER.fim;
  const nF = count(E.eventos, e => e.fonte);
  const presets = [['Tudo', '', ''], ['Últimos 30 dias', addDays(fim, -29), fim], ['Últimas 2 semanas', addDays(fim, -13), fim]];
  const presetOn = (p) => (q.de || '') === p[1] && (q.ate || '') === p[2];
  const nAvanc = ['area', 'ferr', 'risco'].filter(k => q[k]).length + ((q.de || q.ate) && !presets.some(presetOn) ? 1 : 0);
  const opt = (v, l, cur) => `<option value="${esc(v)}" ${v === (cur || '') ? 'selected' : ''}>${esc(l)}</option>`;
  head.insertAdjacentHTML('beforeend', `<div class="hctl">
    <div class="seg" role="group" aria-label="Fonte">${[['', 'Todas', E.eventos.length], ['planilha', 'Planilha', nF.planilha || 0], ['coleta', 'Coleta', nF.coleta || 0]].map(([v, l, n]) => `<button type="button" data-fonte="${v}" aria-pressed="${(q.fonte || '') === v}">${l} <span>${n}</span></button>`).join('')}</div>
    <div class="seg" role="group" aria-label="Período">${presets.map(p => `<button type="button" data-de="${p[1]}" data-ate="${p[2]}" aria-pressed="${presetOn(p)}">${p[0]}</button>`).join('')}</div>
    <button type="button" class="fbtn" id="f-mais" aria-expanded="${filtrosAbertos}"><svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"><path d="M4 6h16"/><path d="M7 12h10"/><path d="M10 18h4"/></svg>Área · Ferramenta · Risco${nAvanc ? `<span class="n">${nAvanc}</span>` : ''}</button>
  </div>`);
  const chips = [];
  if (q.fonte) chips.push([`Fonte: ${FONTE[q.fonte] ? FONTE[q.fonte].l : q.fonte}`, 'fonte']);
  if (q.de || q.ate) chips.push([`Período: ${q.de ? dBR(q.de) : 'início'} a ${q.ate ? dBR(q.ate) : 'fim'}`, 'de,ate']);
  if (q.area) chips.push([`Área: ${q.area}`, 'area']);
  if (q.ferr) chips.push([`Ferramenta: ${FER[q.ferr] ? FER[q.ferr].nome : q.ferr}`, 'ferr']);
  if (q.risco) chips.push([`Risco: ${q.risco}`, 'risco']);
  let after = '';
  if (filtrosAbertos) after += `<div class="fpanel">
    <label>Área<select id="f-area">${opt('', 'Todas', q.area)}${AREAS.map(a => opt(a, a, q.area)).join('')}</select></label>
    <label>Ferramenta<select id="f-ferr">${opt('', 'Todas', q.ferr)}${E.ferramentas.map(f => opt(f.id, f.nome, q.ferr)).join('')}</select></label>
    <label>Risco<select id="f-risco">${opt('', 'Todos', q.risco)}${RISCOS.map(r => opt(r, r, q.risco)).join('')}</select></label>
    <label>De<input type="date" id="f-de" value="${esc(q.de || '')}" min="${PER.inicio}" max="${fim}"></label>
    <label>Até<input type="date" id="f-ate" value="${esc(q.ate || '')}" min="${PER.inicio}" max="${fim}"></label>
  </div>`;
  if (chips.length) after += `<div class="chips">${chips.map(([l, k]) => `<span class="chip">${esc(l)}<button type="button" data-clear="${k}" aria-label="Remover filtro">×</button></span>`).join('')}<button class="linkbtn" type="button" data-clear="fonte,de,ate,area,ferr,risco">Limpar todos</button></div>`;
  if (after) head.insertAdjacentHTML('afterend', after);
  const reset = { page: '', sel: '' };
  main.querySelectorAll('.hctl [data-fonte]').forEach(b => b.onclick = () => setQ({ fonte: b.dataset.fonte, ...reset }));
  main.querySelectorAll('.hctl [data-de]').forEach(b => b.onclick = () => setQ({ de: b.dataset.de, ate: b.dataset.ate, ...reset }));
  main.querySelector('#f-mais').onclick = () => { filtrosAbertos = !filtrosAbertos; render(); };
  const on = (id, k) => { const el = main.querySelector(id); if (el) el.onchange = () => setQ({ [k]: el.value, ...reset }); };
  on('#f-area', 'area'); on('#f-ferr', 'ferr'); on('#f-risco', 'risco'); on('#f-de', 'de'); on('#f-ate', 'ate');
  main.querySelectorAll('[data-clear]').forEach(b => b.onclick = () => setQ({ ...Object.fromEntries(b.dataset.clear.split(',').map(k => [k, ''])), ...reset }));
}

// ---------------- navegação (menu lateral) ----------------
const ICON = {
  acompanhamento: '<svg viewBox="0 0 24 24"><rect x="3" y="3" width="7" height="9" rx="1.5"/><rect x="14" y="3" width="7" height="5" rx="1.5"/><rect x="14" y="12" width="7" height="9" rx="1.5"/><rect x="3" y="16" width="7" height="5" rx="1.5"/></svg>',
  investigar: '<svg viewBox="0 0 24 24"><circle cx="11" cy="11" r="7"/><path d="M20 20l-4-4"/></svg>',
  alertas: '<svg viewBox="0 0 24 24"><path d="M12 3l9 16H3z"/><path d="M12 10v4"/><path d="M12 17v.5"/></svg>',
  governanca: '<svg viewBox="0 0 24 24"><path d="M12 3l8 4v5c0 5-3.5 8-8 9-4.5-1-8-4-8-9V7z"/></svg>',
};
function renderNav() {
  const pend = fAlertas().filter(a => a.status !== 'Tratado').length;
  const items = [['acompanhamento', 'Acompanhamento', ''], ['investigar', 'Investigar', ''], ['alertas', 'Alertas', pend ? `<span class="badge">${pend}</span>` : ''], ['governanca', 'Governança', '']];
  document.getElementById('nav').innerHTML = items.map(([k, l, n]) =>
    `<a href="${k === 'governanca' ? href([k], {}) : link([k])}" ${route.path[0] === k ? 'aria-current="page"' : ''}>${ICON[k]}<span style="flex:1">${l}</span>${n}</a>`).join('');
  const nF = count(E.eventos, e => e.fonte);
  const tot = E.eventos.length || 1;
  const ultReal = E.eventos.filter(e => e.fonte === 'coleta').reduce((m, e) => e.ts > m ? e.ts : m, '');
  const alvo = route.path[0] === 'governanca' ? ['acompanhamento'] : route.path;
  const fa = (k, label) => `<a href="${href(alvo, { ...route.q, fonte: route.q.fonte === k ? '' : k, page: '', sel: '' })}" aria-pressed="${route.q.fonte === k}"><span>${label}</span><b>${num(nF[k] || 0)}</b></a>`;
  document.getElementById('fontes').innerHTML =
    fa('planilha', 'Planilha') +
    `<div class="fbar"><i style="width:${((nF.planilha || 0) / tot * 100).toFixed(1)}%"></i></div>` +
    fa('coleta', '<span class="dot"></span>Coleta');
  // o status do coletor fica no bloco “Fonte dos eventos” do menu lateral
}

// ---------------- busca (topo e Investigar) ----------------
const INDEX = [
  ...E.tipos.map(t => ({ k: 'informação', label: t.nome, sub: t.classificacao, path: ['investigar', 'info', t.id] })),
  ...E.usuarios.map(u => ({ k: 'pessoa', label: u.nome, sub: `${u.area} · ${u.cargo}`, path: ['investigar', 'pessoa', u.id] })),
  ...E.ferramentas.map(f => ({ k: 'ferramenta', label: f.nome, sub: f.status, path: ['investigar', 'ferramenta', f.id] })),
  ...AREAS.map(a => ({ k: 'área', label: a, sub: '', path: ['investigar', 'area', a] })),
].map(x => ({ ...x, n: norm(x.label + ' ' + x.sub + ' ' + x.path[2]) }));
function suggest(q) {
  const t = norm(q).trim(); if (!t) return [];
  const id = t.toUpperCase();
  const out = [];
  if (/^(EVT|CAP)-/.test(id)) E.eventos.filter(e => e.id.startsWith(id)).slice(0, 6).forEach(e => out.push({ k: 'evento', label: e.id, sub: `${e.informacao} · ${e.ferramenta}`, path: ['investigar', 'evento', e.id] }));
  if (/^ALT-/.test(id)) E.alertas.filter(a => a.id.startsWith(id)).slice(0, 6).forEach(a => out.push({ k: 'alerta', label: a.id, sub: `${a.informacao} · ${a.status}`, path: ['alertas'], q: { status: 'Todos', sel: a.id } }));
  const words = t.split(/\s+/);
  INDEX.filter(x => words.every(w => x.n.includes(w))).slice(0, 12).forEach(x => out.push(x));
  return out;
}
function attachSearch(input, box) {
  let items = [], on = -1;
  const draw = () => {
    items = suggest(input.value);
    if (!input.value.trim()) { box.hidden = true; return; }
    box.hidden = false;
    box.innerHTML = items.length ? items.map((x, i) =>
      `<a href="${x.q ? href(x.path, x.q) : link(x.path)}" class="${i === on ? 'on' : ''}"><span class="k">${esc(x.k)}</span><span>${esc(x.label)} <span class="muted small">${esc(x.sub)}</span></span></a>`).join('')
      : '<div class="empty">Nada encontrado. Tente o nome de uma informação (ex.: “contrato”), pessoa, ferramenta, área ou um ID (EVT-00010, ALT-0002).</div>';
  };
  input.addEventListener('input', () => { on = -1; draw(); });
  input.addEventListener('focus', draw);
  input.addEventListener('keydown', (ev) => {
    if (ev.key === 'ArrowDown') { on = Math.min(items.length - 1, on + 1); draw(); ev.preventDefault(); }
    else if (ev.key === 'ArrowUp') { on = Math.max(0, on - 1); draw(); ev.preventDefault(); }
    else if (ev.key === 'Enter') { const x = items[on < 0 ? 0 : on]; if (x) { box.hidden = true; input.blur(); if (x.path[0] === 'investigar' && x.path[1]) openModal(x.path[1], x.path[2]); else location.hash = x.q ? href(x.path, x.q) : link(x.path); } }
    else if (ev.key === 'Escape') { box.hidden = true; input.blur(); }
  });
  input.addEventListener('blur', () => setTimeout(() => { box.hidden = true; }, 150));
}

// ---------------- gráficos ----------------
function weeksOf(de, ate) {
  const out = []; let w = weekStart(de);
  while (w <= ate) { out.push(w); w = addDays(w, 7); }
  return out;
}
function seriesSemanal(evs) {
  const de = route.q.de || PER.inicio, ate = route.q.ate || PER.fim;
  const ws = weeksOf(de, ate);
  const map = Object.fromEntries(ws.map(w => [w, { w, fim: addDays(w, 6), total: 0, nao: 0, sens: 0, ...Object.fromEntries(RISCOS.map(r => [r, 0])) }]));
  evs.forEach(e => { const s = map[weekStart(e.data)]; if (!s) return; s.total++; s[e.fonte] = (s[e.fonte] || 0) + 1; s[e.risco] = (s[e.risco] || 0) + 1; if (e.naoAprovada) s.nao++; if (e.sensivel) s.sens++; });
  return ws.map(w => { const s = map[w]; s.parcial = s.fim > PER.fim || w < PER.inicio; return s; });
}
function spark(vals, color, o = {}) {
  if (vals.length < 2) return '';
  const W = 280, H = 44;
  const mx = o.max != null ? o.max : Math.max(...vals, 1e-9), mn = o.min != null ? o.min : Math.min(...vals);
  const y = (v) => (H - 4 - (Math.min(v, mx) - mn) / ((mx - mn) || 1) * (H - 8)).toFixed(1);
  const pts = vals.map((v, i) => `${(i * W / (vals.length - 1)).toFixed(1)},${y(v)}`).join(' ');
  const meta = o.meta != null ? `<line x1="0" x2="${W}" y1="${y(o.meta)}" y2="${y(o.meta)}" stroke="${css('--ink-4')}" stroke-width="1.5" stroke-dasharray="4 4"/>` : '';
  return `<svg class="sp" viewBox="0 0 ${W} ${H}" preserveAspectRatio="none" aria-hidden="true">${meta}<polyline points="${pts}" fill="none" stroke="${color}" stroke-width="2" stroke-linejoin="round" stroke-linecap="round" vector-effect="non-scaling-stroke"/></svg>`;
}
function chartLinhaMeta(el, weeks) {
  // viewBox fixo, como na referência; a escala usa só as semanas completas
  const W = 560, H = 220, m = { l: 40, r: 10, t: 30, b: 30 };
  const iw = W - m.l - m.r, ih = H - m.t - m.b;
  const vals = weeks.map(s => s.total ? s.nao / s.total : 0);
  const completos = vals.filter((v, i) => !weeks[i].parcial);
  const mx = Math.min(1, Math.max(0.05, niceMax(Math.max(...(completos.length ? completos : vals), META.naoAprovada) * 1.1)));
  const step = weeks.length > 1 ? iw / (weeks.length - 1) : 0;
  const x = (i) => m.l + (weeks.length > 1 ? i * step : iw / 2);
  const y = (v) => m.t + ih - Math.min(v, mx) / mx * ih;
  const crit = css('--primary');
  const nt = Math.round(mx * 100) % 4 === 0 ? 4 : 5;
  let g = `<rect x="${m.l}" y="${y(META.naoAprovada)}" width="${iw}" height="${y(0) - y(META.naoAprovada)}" fill="${css('--surface-2')}"/>`;
  for (let i = 0; i <= nt; i++) { const v = mx * i / nt; g += `<line x1="${m.l}" x2="${W - m.r}" y1="${y(v)}" y2="${y(v)}" stroke="${i ? css('--line-2') : css('--border')}"/><text x="${m.l - 8}" y="${y(v) + 4}" text-anchor="end">${pct(v, 0)}</text>`; }
  g += `<line x1="${m.l}" x2="${W - m.r}" y1="${y(META.naoAprovada)}" y2="${y(META.naoAprovada)}" stroke="${css('--ink-4')}" stroke-width="1.5" stroke-dasharray="5 4"/>`;
  g += `<text x="${W - m.r - 4}" y="${y(0) - 6}" text-anchor="end" style="fill:${css('--ink-2')};font-weight:700">meta &lt; 3%</text>`;
  for (let i = 1; i < weeks.length; i++) {
    const parc = weeks[i].parcial || weeks[i - 1].parcial;
    g += `<line x1="${x(i - 1)}" y1="${y(vals[i - 1])}" x2="${x(i)}" y2="${y(vals[i])}" stroke="${crit}" stroke-width="${parc ? 2 : 2.5}" stroke-linecap="round" ${parc ? 'stroke-dasharray="4 4"' : ''}/>`;
  }
  const every = Math.max(1, Math.ceil(weeks.length / 5));
  weeks.forEach((s, i) => {
    const v = vals[i];
    const tip = `<b>Semana de ${dBR(s.w)}</b>${s.parcial ? ' (parcial, poucos eventos)' : ''}<br>${pct(v)} em ferramenta não aprovada<br>${s.nao} de ${s.total} eventos<br>${v >= META.naoAprovada ? '▲ acima' : '✓ dentro'} da meta de 3%`;
    const hw = weeks.length > 1 ? step : iw;
    g += `<g class="hov"${tipAttr(tip)}><rect class="hit" x="${x(i) - hw / 2}" y="${m.t}" width="${hw}" height="${ih}"/><line class="x" x1="${x(i)}" x2="${x(i)}" y1="${m.t}" y2="${m.t + ih}"/>
      <circle cx="${x(i)}" cy="${y(v)}" r="${s.parcial ? 4 : 3}" fill="${s.parcial ? '#fff' : crit}" stroke="${crit}" stroke-width="${s.parcial ? 2 : 0}"/></g>`;
    if (v > mx) g += `<text x="${x(i) - 8}" y="${y(v) - 8}" text-anchor="end" style="fill:${css('--primary')};font-weight:700">↑ ${pct(v, 0)} (${s.total} eventos)</text>`;
    if (i % every === 0 || i === weeks.length - 1) g += `<text x="${x(i)}" y="${H - 8}" text-anchor="${i === 0 ? 'start' : i === weeks.length - 1 ? 'end' : 'middle'}">${dBR(s.w)}</text>`;
  });
  el.innerHTML = `<svg class="chart" viewBox="0 0 ${W} ${H}" role="img" aria-label="Percentual semanal de eventos em ferramenta não aprovada, com meta de 3%">${g}</svg>`;
}
// barras horizontais em HTML: rows = [{label, sub, total, segs:[{v, color, name}], href}]
function hbars(rows, opts = {}) {

// barras com número e share ("137 · 40,2%"); total = base do %
function barrasShare(rows, total, cor) {
  if (!rows.length) return '<div class="empty-state">Sem eventos no recorte.</div>';
  const mx = Math.max(...rows.map(r => r.n), 1);
  return `<div class="hb hbs">${rows.map(r => {
    const segs = (r.segs || [{ v: r.n, color: cor || 'var(--bar)', name: r.label }]).filter(s => s.v > 0);
    const tip = `<b>${esc(r.label)}</b> · ${num(r.n)} · ${total ? pct(r.n / total) : '0%'}<br>` + (r.segs ? r.segs.filter(s => s.v).map(s => `<div class="row"><span><i style="background:${s.color}"></i>${esc(s.name)}</span><b>${s.v} · ${pct(s.v / r.n)}</b></div>`).join('') : '');
    const inner = `<span class="l">${esc(r.label)}${r.sub ? `<small>${r.sub}</small>` : ''}</span><span class="t"${tipAttr(tip)}>${segs.map(s => `<i style="width:${(s.v / mx * 100).toFixed(2)}%;background:${s.color}"></i>`).join('')}</span><span class="v">${num(r.n)} <small>${total ? pct(r.n / total) : ''}</small></span>`;
    return r.href ? `<a class="row" href="${r.href}">${inner}</a>` : inner;
  }).join('')}</div>`;
}

function rankList(evs, key, kind, title, n = 6) {  // usada no modal

}

const COLUNAS = [
  ['Aberto', 'var(--st-aberto)', 'Aguardando o responsável assumir'],
  ['Em análise', 'var(--st-analise)', 'Responsável verificando a evidência'],
  ['Tratado', 'var(--st-tratado)', 'Fechado com desfecho e ação'],
];
const LIM_COL = 15;
let colunaAberta = {};   // colunas com "mostrar mais" ativo
const ORDENS = [['risco-desc', 'Risco: maior → menor'], ['risco-asc', 'Risco: menor → maior'], ['data-desc', 'Data: mais recente → mais antiga'], ['data-asc', 'Data: mais antiga → mais recente']];
let ordemCol = { 'Aberto': 'risco-desc', 'Em análise': 'risco-desc', 'Tratado': 'risco-desc' };
try { Object.assign(ordemCol, JSON.parse(localStorage.getItem('gerencia-ordem-quadro') || '{}')); } catch (e) { /* sem armazenamento: usa o padrão */ }
function ordenar(lista, modo) {
  const r = (a) => RORD[a.risco] ?? 9, d = (a) => a.iso || '';
  const f = {
    'risco-desc': (a, b) => r(a) - r(b) || d(b).localeCompare(d(a)),
    'risco-asc': (a, b) => r(b) - r(a) || d(b).localeCompare(d(a)),
    'data-desc': (a, b) => d(b).localeCompare(d(a)) || r(a) - r(b),
    'data-asc': (a, b) => d(a).localeCompare(d(b)) || r(a) - r(b),
  }[modo] || ((a, b) => r(a) - r(b));
  return lista.slice().sort(f);
}
function vistaQuadro(main) {

    </section>`;
  }).join('');
  main.innerHTML = `<div class="head"><div><h1>Alertas</h1><p>Arraste o cartão para mudar de etapa, ou clique nele para ver a evidência e registrar o tratamento.</p></div></div>
    <div class="toolbar">

    </div>
    <div class="kanban">${colunas}</div>`;
  const b = main.querySelector('#a-busca');
  let t; b.oninput = () => { clearTimeout(t); t = setTimeout(() => setQ({ busca: b.value }), 300); };
  if (q.busca && document.activeElement === document.body) { b.focus(); b.setSelectionRange(b.value.length, b.value.length); }

function formCadastro(k, item) {
  const def = CAD_DEF[k]; const campos = def.campos();
  const el = document.getElementById('modal');
  closeModal();
  el.hidden = false; document.body.style.overflow = 'hidden';
  const campo = (c) => {
    const v = item ? (item[c.k] ?? '') : '';
    const att = `id="cf-${c.k}" name="${c.k}" ${c.req ? 'required' : ''} ${c.ph ? `placeholder="${esc(c.ph)}"` : ''}`;
    if (c.tipo === 'area') return `<textarea ${att}>${esc(v)}</textarea>`;
    if (c.tipo === 'select') return `<select ${att}><option value="">Escolha…</option>${c.ops.map(o => `<option ${o === v ? 'selected' : ''}>${esc(o)}</option>`).join('')}</select>`;
    if (c.tipo === 'lista') return `<input ${att} list="dl-${c.k}" value="${esc(v)}" autocomplete="off"><datalist id="dl-${c.k}">${c.ops.map(o => `<option value="${esc(o)}">`).join('')}</datalist>`;
    return `<input ${att} value="${esc(v)}" autocomplete="off">`;
  };
  el.innerHTML = `<div class="mback" data-mclose></div>
    <div class="mbox mform" role="dialog" aria-modal="true" aria-label="${esc(item ? 'Editar ' : '') + def.titulo}">
      <div class="mhead"><span class="mkind">${item ? 'Editar' : def.novo}</span><button class="mx" type="button" data-mclose aria-label="Fechar">×</button></div>
      <form class="mbody cform" novalidate>
        ${def.id ? `<p class="muted small" style="margin:0 0 12px">Código: <b>${esc(item ? item.id : def.id())}</b></p>` : ''}
        ${campos.map(c => `<label><span>${esc(c.l)}${c.req ? ' <span class="req">*</span>' : ''}</span>${campo(c)}</label>`).join('')}
        <p class="cerr" id="cf-erro" hidden></p>
        <div class="acts"><button class="btn" type="button" data-mclose>Cancelar</button><button class="btn primary" type="submit">${item ? 'Salvar alterações' : 'Cadastrar'}</button></div>
      </form>
    </div>`;
  el.querySelectorAll('[data-mclose]').forEach(b => b.onclick = closeModal);
  const f = el.querySelector('form');
  const primeiro = f.querySelector('input,select,textarea'); if (primeiro) primeiro.focus();
  f.onsubmit = (ev) => {
    ev.preventDefault();
    const val = {}; campos.forEach(c => { val[c.k] = (f.elements[c.k].value || '').trim(); });
    const erro = (m) => { const e = el.querySelector('#cf-erro'); e.textContent = m; e.hidden = false; };
    const falta = campos.filter(c => c.req && !val[c.k]).map(c => c.l);
    if (falta.length) return erro(`Preencha: ${falta.join(', ')}.`);
    const dup = def.lista().some(x => x !== item && norm(x[def.chave]) === norm(val[def.chave]));
    if (dup) return erro(`Já existe um cadastro com esse ${def.campos().find(c => c.k === def.chave).l.toLowerCase()}.`);
    let novo = { ...(item ? { id: item.id } : (def.id ? { id: def.id() } : {})), ...val, criado_por: quem(), criado_em: item ? item.criado_em : agora() };
    if (item) novo.alterado_em = agora();
    if (def.antes) novo = def.antes(novo);
    delete novo.cadastro;
    if (item) CAD[k] = CAD[k].map(y => ((def.id ? y.id === item.id : y[def.chave] === item[def.chave]) ? novo : y));
    else CAD[k].push(novo);
    if (!salvarCad()) return erro('Este navegador não permite salvar. Abra o painel em uma janela normal (não anônima).');
    location.reload();
  };
}
