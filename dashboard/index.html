const KINDS = {
  info: { nome: 'Informação', match: (e, id) => e.informacao_id === id, label: (id) => TIP[id] ? TIP[id].nome : id },
  pessoa: { nome: 'Pessoa', match: (e, id) => e.usuario_id === id, label: (id) => nomeUsr(id) },
  ferramenta: { nome: 'Ferramenta', match: (e, id) => e.ferramenta_id === id, label: (id) => FER[id] ? FER[id].nome : id },
  area: { nome: 'Área', match: (e, id) => e.area === id, label: (id) => id },
};
function rankList(evs, key, kind, title, n = 6) {  // usada no modal
  const g = {};
  evs.forEach(e => { const k = key(e); (g[k] = g[k] || { k, total: 0, ac: 0 }); g[k].total++; if (e.risco === 'Crítico' || e.risco === 'Alto') g[k].ac++; });
  const rows = Object.values(g).sort((a, b) => b.ac - a.ac || b.total - a.total);
  return `<section class="card"><div class="card-h"><h3>${title}</h3></div>
    ${hbars(rows.slice(0, n).map(r => ({ label: KINDS[kind].label(r.k), total: r.total, href: link(['investigar', kind, r.k]),
      segs: [{ v: r.ac, color: COR['Crítico'], name: 'Alto ou crítico' }, { v: r.total - r.ac, color: 'var(--bar-soft)', name: 'Demais' }] })))}
    ${rows.length > n ? `<p class="muted small" style="margin:8px 0 0">+ ${rows.length - n} outros</p>` : ''}</section>`;
}
function vistaInvestigar(main) {
  const [, kindR, idR] = route.path;
  if (kindR && (KINDS[kindR] || kindR === 'evento')) { route.path = ['investigar']; vistaInvestigar(main); setTimeout(() => openModal(kindR, idR), 0); return; }
  const kind = null, id = null;
  if (kind === 'evento') {
    const e = EVT[id];
    const a = e && e.alerta ? ALT[e.alerta.id || e.alerta] : E.alertas.find(x => x.evento_id === id);
    main.innerHTML = `<div class="crumb"><a href="${link(['investigar'])}">Investigar</a> / Evento</div>
      <div class="head"><div><h1>${esc(id)}</h1><p>${e ? `${esc(e.informacao)} em ${esc(e.ferramenta)}` : ''}</p></div></div>
      <div class="card" style="max-width:760px">${evidencia(e, a)}</div>`;
    return;
  }
  const searchBox = `<div class="bigsearch"><label><svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="#697077" stroke-width="2" stroke-linecap="round" aria-hidden="true"><circle cx="11" cy="11" r="7"/><path d="M20 20l-4-4"/></svg><input id="qbig" type="search" placeholder="Que informação, pessoa, ferramenta ou área você quer rastrear?" autocomplete="off" aria-label="Busca"></label><div class="sugg" id="qbig-s" hidden></div></div>`;
  const evsAll = fEventos();
  if (!kind || !KINDS[kind]) {
    const porTipo = E.tipos.map(t => {
      const ev = evsAll.filter(e => e.informacao_id === t.id);
      return { t, usos: ev.length, pessoas: new Set(ev.map(e => e.usuario_id)).size, ferr: new Set(ev.map(e => e.ferramenta_id)).size,
        fora: ev.filter(e => e.naoAprovada).length, ac: ev.filter(e => e.risco === 'Crítico' || e.risco === 'Alto').length,
        coleta: ev.filter(e => e.fonte === 'coleta').length, ult: ev.reduce((m, e) => e.ts > m ? e.ts : m, '') };
    }).filter(r => r.usos).sort((a, b) => b.ac - a.ac || b.usos - a.usos);
    main.innerHTML = `<div class="head"><div><h1>Investigar</h1><p>Comece pela informação e veja quem a usou, em qual ferramenta, quando e com qual risco. Ou parta de uma pessoa, ferramenta ou área.</p></div></div>
      ${searchBox}
      <div class="qchips">mais expostos: ${porTipo.slice(0, 5).map(r => `<a href="${link(['investigar', 'info', r.t.id])}">${esc(r.t.nome)}</a>`).join('')}</div>
      <section class="card mt"><div class="card-h"><h3>Exposição por tipo de informação</h3><span class="hint">Clique numa linha para ver o resumo</span></div>
      <div class="tbl-wrap"><table class="tbl"><thead><tr><th>Informação</th><th>Classificação</th><th class="num">Usos</th><th class="num">Pessoas</th><th class="num">Ferramentas</th><th class="num">Em não aprovada</th><th class="num">Alto ou crítico</th><th class="num">Coleta</th><th class="num">Último uso</th></tr></thead>
      <tbody>${porTipo.map(r => `<tr class="click" data-go="${link(['investigar', 'info', r.t.id])}"><td>${esc(r.t.nome)}<span class="sub mono">${esc(r.t.id)}</span></td><td>${clsChip(r.t.classificacao)}</td><td class="num">${r.usos}</td><td class="num">${r.pessoas}</td><td class="num">${r.ferr}</td><td class="num">${r.fora}</td><td class="num"><b style="color:${r.ac ? COR['Crítico'] : 'inherit'}">${r.ac}</b></td><td class="num">${r.coleta || '—'}</td><td class="num">${dtBR(r.ult).slice(0, 5)}</td></tr>`).join('')}</tbody></table></div></section>`;
    attachSearch(main.querySelector('#qbig'), main.querySelector('#qbig-s'));
    bindRowLinks(main);
    return;
  }
  const K = KINDS[kind];
  const evs = evsAll.filter(e => K.match(e, id)).sort((a, b) => b.ts.localeCompare(a.ts));
  const ac = evs.filter(e => e.risco === 'Crítico' || e.risco === 'Alto').length;
  const fora = evs.filter(e => e.naoAprovada).length;
  const nAl = evs.filter(e => e.alerta || E.alertas.some(a => a.evento_id === e.id)).length;
  let headSub = '';
  if (kind === 'info' && TIP[id]) headSub = `${clsChip(TIP[id].classificacao)} <span class="muted">${esc(TIP[id].categoria)} · área típica: ${esc(TIP[id].area_tipica)}</span>`;
  if (kind === 'pessoa' && USR[id]) headSub = `<span class="muted">${esc(USR[id].area)} · ${esc(USR[id].cargo)} · ${esc(USR[id].modelo)}</span>`;
  if (kind === 'ferramenta' && FER[id]) headSub = `${stTag(id)} <span class="muted">· ${esc(FER[id].tipo)} · finalidade aprovada: ${esc(FER[id].finalidade)} · controles: ${esc(FER[id].controles)}</span>`;
  const dims = { info: [['pessoa', e => e.usuario_id, 'Quem usou'], ['ferramenta', e => e.ferramenta_id, 'Em quais ferramentas'], ['area', e => e.area, 'De quais áreas']],
    pessoa: [['info', e => e.informacao_id, 'Quais informações'], ['ferramenta', e => e.ferramenta_id, 'Em quais ferramentas'], ['area', e => e.area, 'Áreas']],
    ferramenta: [['info', e => e.informacao_id, 'Quais informações'], ['pessoa', e => e.usuario_id, 'Quem usou'], ['area', e => e.area, 'De quais áreas']],
    area: [['info', e => e.informacao_id, 'Quais informações'], ['ferramenta', e => e.ferramenta_id, 'Em quais ferramentas'], ['pessoa', e => e.usuario_id, 'Quem usou']] }[kind];
  // linha do tempo agrupada pela primeira dimensão "de destino"
  const gKind = kind === 'info' ? 'ferramenta' : 'info';
  const gKey = gKind === 'ferramenta' ? (e => e.ferramenta_id) : (e => e.informacao_id);
  const groups = {};
  evs.forEach(e => { const k = gKey(e); (groups[k] = groups[k] || []).push(e); });
  const gList = Object.entries(groups).sort((a, b) => {
    const s = (l) => Math.min(...l.map(e => RORD[e.risco] ?? 9));
    return s(a[1]) - s(b[1]) || b[1].length - a[1].length;
  });
  const who = (e) => kind === 'pessoa' ? esc(e.ferramenta) : `${esc(nomeUsr(e.usuario_id))} <span class="muted">· ${esc(kind === 'ferramenta' ? e.informacao : e.area)}</span>`;
  main.innerHTML = `<div class="crumb"><a href="${link(['investigar'])}">Investigar</a> / ${K.nome}</div>
    <div class="head"><div><h1>${esc(K.label(id))}</h1><p>${headSub}</p></div><div class="right">${searchBox.replace('bigsearch"', 'bigsearch" style="width:340px"')}</div></div>
    <section class="kpis" style="grid-template-columns:repeat(auto-fit,minmax(170px,1fr))">
      <div class="kpi"><span class="lab">Usos em IA</span><span class="val">${num(evs.length)}</span><span class="foot">${srcTag('planilha')} ${evs.filter(e => e.fonte === 'planilha').length} · ${srcTag('coleta')} ${evs.filter(e => e.fonte === 'coleta').length}</span></div>
      <div class="kpi"><span class="lab">${kind === 'pessoa' ? 'Informações' : 'Pessoas'}</span><span class="val">${new Set(evs.map(e => kind === 'pessoa' ? e.informacao_id : e.usuario_id)).size}</span><span class="foot">distintas</span></div>
      <div class="kpi"><span class="lab">${kind === 'ferramenta' ? 'Informações' : 'Ferramentas'}</span><span class="val">${new Set(evs.map(e => kind === 'ferramenta' ? e.informacao_id : e.ferramenta_id)).size}</span><span class="foot">distintas</span></div>
      <div class="kpi"><span class="lab">Alto ou crítico</span><span class="val" style="color:${ac ? COR['Crítico'] : 'inherit'}">${num(ac)}</span><span class="foot">${num(nAl)} com alerta</span></div>
      <div class="kpi"><span class="lab">Em ferramenta não aprovada</span><span class="val">${num(fora)}</span><span class="foot">${pct(evs.length ? fora / evs.length : 0)} dos usos</span></div>
    </section>
    ${evs.length ? `<div class="flows">${dims.map(d => rankList(evs, d[1], d[0], d[2])).join('')}</div>
    <section class="card mt"><div class="card-h"><h3>Linha do tempo</h3><span class="hint">agrupada por ${gKind === 'ferramenta' ? 'ferramenta' : 'informação'} · mais arriscado primeiro</span></div>
      ${gList.map(([k, l], i) => {
        const rc = count(l, e => e.risco);
        return `<details class="grp" ${i < 3 ? 'open' : ''}><summary><b>${esc(KINDS[gKind].label(k))}</b> ${gKind === 'ferramenta' ? stTag(k) : clsChip(l[0].sensibilidade)}<span class="cnt">${RISCOS.filter(r => rc[r]).map(r => `${riskChip(r)}<span class="mono">${rc[r]}</span>`).join(' ')} <span>· ${l.length} uso(s)</span></span></summary>
        <ul class="tl">${l.map(e => `<li><span class="d">${dtBR(e.ts)}</span><span>${who(e)}<br><span class="muted small">${esc(e.forma_uso)} · ${esc(e.finalidade)} · registro: ${esc(e.origem)}</span></span><span class="x">${srcTag(e.fonte)} ${riskChip(e.risco)} ${ruleChip(e.regra)} <a href="${link(['investigar', 'evento', e.id])}" class="small">evidência →</a></span></li>`).join('')}</ul></details>`;
      }).join('')}
    </section>` : '<div class="card empty-state">Nenhum uso no recorte atual. Remova filtros para ver o histórico completo.</div>'}`;
  attachSearch(main.querySelector('#qbig'), main.querySelector('#qbig-s'));
}

const PAGE = 20;
function vistaAlertas(main) {

  const cnt = count(base, a => a.status);
  const tabs = [...STATUS_ALERTA.map(s => [s, s, cnt[s] || 0]), ['Todos', 'Todos', base.length], ['sem', 'Risco sem alerta', semAlerta.length]];
  const isSem = tab === 'sem';
  const busca = norm(q.busca || '');
  let rows;
  if (isSem) {
    rows = semAlerta.map(e => ({ id: e.id, fonte: e.fonte, ev: e, a: null, risco: e.risco, iso: e.ts, quem: e.usuario_id, area: e.area, ferramenta: e.ferramenta, info: e.informacao, sens: e.sensibilidade, regra: e.regra, resp: '—', status: '—' }));
  } else {
    rows = base.filter(a => tab === 'Todos' || a.status === tab).map(a => ({ id: a.id, fonte: a.fonte, ev: EVT[a.evento_id], a, risco: a.risco, iso: a.iso, quem: a.usuario_id, area: a.area, ferramenta: a.ferramenta, info: a.informacao, sens: a.sensibilidade, regra: a.regra, resp: a.responsavel, status: a.status }));
  }
  if (q.resp) rows = rows.filter(r => r.resp === q.resp);
  if (busca) rows = rows.filter(r => norm([r.id, nomeUsr(r.quem), r.area, r.ferramenta, r.info, r.regra].join(' ')).includes(busca));
  rows.sort((a, b) => (RORD[a.risco] ?? 9) - (RORD[b.risco] ?? 9) || b.iso.localeCompare(a.iso));
  const pages = Math.max(1, Math.ceil(rows.length / PAGE));
  const page = Math.min(pages, Math.max(1, +q.page || 1));
  const slice = rows.slice((page - 1) * PAGE, page * PAGE);
  const sel = q.sel ? rows.find(r => r.id === q.sel) || (ALT[q.sel] ? { id: q.sel, a: ALT[q.sel], ev: EVT[ALT[q.sel].evento_id] } : (EVT[q.sel] ? { id: q.sel, a: null, ev: EVT[q.sel] } : null)) : null;
  const resps = [...new Set(E.alertas.map(a => a.responsavel))].sort();

  main.innerHTML = `<div class="head"><div><h1>Alertas</h1><p>Fila de trabalho do time de governança. Clique num alerta para ver a evidência e registrar o tratamento.</p></div></div>
  <section class="rotina" aria-label="Como funciona a fila">
    <div><b><i style="background:var(--st-aberto)"></i>1 · Aberto</b>O motor gerou o alerta e ele foi para um responsável: credencial → Segurança; dado pessoal → Privacidade; ferramenta não aprovada ou financeiro → Compliance; demais casos → gestor da área.</div>
    <div><b><i style="background:var(--st-analise)"></i>2 · Em análise</b>O responsável clica em <em>Assumir análise</em>, confere a evidência e fala com o colaborador.</div>
    <div><b><i style="background:var(--st-tratado)"></i>3 · Tratado</b>Fecha com desfecho, ação tomada e comentário. Fica no histórico do alerta, com quem tratou e quando.</div>
  </section>
  <nav class="tabs">${tabs.map(([k, l, n]) => `<a href="${href(['alertas'], { ...gq(), status: k, resp: q.resp, busca: q.busca })}" ${tab === k ? 'aria-current="page"' : ''}>${l}<span class="n">${n}</span></a>`).join('')}</nav>
  <div class="toolbar">
    <input id="a-busca" type="search" placeholder="Filtrar por pessoa, ferramenta, informação, regra ou ID" value="${esc(q.busca || '')}" style="flex:1;min-width:220px;max-width:420px">
    ${isSem ? '' : `<select id="a-resp"><option value="">Todos os responsáveis</option>${resps.map(r => `<option ${q.resp === r ? 'selected' : ''}>${esc(r)}</option>`).join('')}</select>`}
    <span class="muted small">${num(rows.length)} ${isSem ? 'evento(s)' : 'alerta(s)'}</span>
    <button class="btn" id="a-csv" type="button" style="margin-left:auto">⇩ Exportar CSV</button>
  </div>
  ${isSem ? '<p class="note" style="margin-top:0">Eventos que o motor classificou como Alto ou Crítico e que não têm alerta, da planilha e da coleta. São candidatos a abrir alerta.</p>' : ''}
  <div class="split">
    <section class="card" style="padding:6px 6px 10px">
      ${slice.length ? `<div class="tbl-wrap"><table class="tbl"><thead><tr><th>Risco</th><th>Fonte</th><th>Quando</th><th>Quem</th><th>Ferramenta</th><th>Informação</th><th>Regra</th>${isSem ? '' : '<th>Situação</th><th>Responsável</th>'}</tr></thead>
      <tbody>${slice.map(r => `<tr class="click ${sel && sel.id === r.id ? 'sel' : ''}" data-sel="${esc(r.id)}"><td>${riskChip(r.risco)}</td><td>${srcTag(r.fonte)}</td><td class="mono small">${dtBR(r.iso)}</td><td>${esc(nomeUsr(r.quem))}<span class="sub">${esc(r.area)}</span></td><td>${esc(r.ferramenta)}${r.ev ? `<span class="sub">${stTag(r.ev.ferramenta_id)}</span>` : ''}</td><td>${esc(r.info)}<span class="sub">${clsChip(r.sens)}</span></td><td>${ruleChip(r.regra)}</td>${isSem ? '' : `<td class="small">${esc(r.status)}</td><td class="small">${esc(r.resp)}</td>`}</tr>`).join('')}</tbody></table></div>
      <div class="pager">Página ${page} de ${pages}
        ${page > 1 ? `<a href="${href(['alertas'], { ...q, page: page - 1, sel: '' })}">← anterior</a>` : '<span class="off">← anterior</span>'}
        ${page < pages ? `<a href="${href(['alertas'], { ...q, page: page + 1, sel: '' })}">próxima →</a>` : '<span class="off">próxima →</span>'}</div>`
      : '<div class="empty-state">Nada nesta aba com os filtros atuais.</div>'}
    </section>
    <aside class="card drawer ${sel ? 'open' : ''}" id="drawer">
      ${sel ? `<div style="display:flex;align-items:center;margin-bottom:6px"><h3 style="font-size:15px">${sel.a ? 'Alerta ' + esc(sel.a.id) : 'Evento sem alerta'}</h3><button class="btn close" type="button" id="d-close" style="margin-left:auto">Fechar ✕</button></div>${evidencia(sel.ev, sel.a)}${sel.a && sel.a.evidencia ? `<p class="note">Evidência do alerta: ${esc(sel.a.evidencia)}</p>` : ''}${blocoTratamento(sel.a, sel.ev)}`
      : '<div class="empty-state" style="padding:30px 10px">Selecione um alerta para ver a evidência e registrar o tratamento.</div>'}
    </aside>
  </div>`;
  main.querySelectorAll('tr[data-sel]').forEach(tr => tr.onclick = () => setQ({ sel: tr.dataset.sel }));
  const b = main.querySelector('#a-busca');
  let t; b.oninput = () => { clearTimeout(t); t = setTimeout(() => setQ({ busca: b.value, page: '', sel: '' }), 300); };
  const r = main.querySelector('#a-resp'); if (r) r.onchange = () => setQ({ resp: r.value, page: '', sel: '' });
  const c = main.querySelector('#d-close'); if (c) c.onclick = () => setQ({ sel: '' });
  if (sel) bindTratamento(main.querySelector('#drawer'), sel.a, sel.ev);
  main.querySelector('#a-csv').onclick = () => {
    const head = ['id', 'fonte', 'risco', 'data_hora', 'usuario', 'area', 'ferramenta', 'informacao', 'sensibilidade', 'regra', 'situacao', 'responsavel'];
    const lines = [head.join(';'), ...rows.map(x => [x.id, FONTE[x.fonte] ? FONTE[x.fonte].l : '', x.risco, dtBR(x.iso), nomeUsr(x.quem), x.area, x.ferramenta, x.info, x.sens, x.regra, x.status, x.resp].map(v => `"${String(v ?? '').replace(/"/g, '""')}"`).join(';'))];
    const blob = new Blob(['\ufeff' + lines.join('\n')], { type: 'text/csv;charset=utf-8' });
    const a = document.createElement('a'); a.href = URL.createObjectURL(blob); a.download = `gerencia-alertas-${tab}.csv`; a.click(); setTimeout(() => URL.revokeObjectURL(a.href), 1000);
  };
  // mantém o foco na busca após re-render
  if (q.busca && document.activeElement === document.body) { b.focus(); b.setSelectionRange(b.value.length, b.value.length); }
}

function bindRowLinks(root) { root.querySelectorAll('tr[data-go]').forEach(tr => tr.onclick = () => { const m = tr.dataset.go.match(RX_ENT); if (m) openModal(m[1], decodeURIComponent(m[2])); else location.hash = tr.dataset.go; }); }

// =====================================================================
// MODAL — resumo de informação, pessoa, ferramenta, área ou evento sem sair da página
// =====================================================================
const MODAL = { stack: [] };
const KIND_NOME = { info: 'Informação', pessoa: 'Pessoa', ferramenta: 'Ferramenta', area: 'Área', evento: 'Evento' };
function entidadeHTML(kind, id) {
  if (kind === 'evento') {
    const e = EVT[id];
    const a = e ? E.alertas.find(x => x.evento_id === id) : null;
    return `<div class="mtitle"><h2>${e ? esc(e.informacao) + ' → ' + esc(e.ferramenta) : esc(id)}</h2></div>
      <div class="card">${evidencia(e, a)}</div>
      ${a ? `<div class="mfoot"><a href="${href(['alertas'], { ...gq(), status: a.status, sel: a.id })}">Tratar na fila de alertas →</a></div>` : ''}`;
  }
  const K = KINDS[kind];
  const evs = fEventos().filter(e => K.match(e, id)).sort((a, b) => b.ts.localeCompare(a.ts));
  const ac = evs.filter(e => e.risco === 'Crítico' || e.risco === 'Alto').length;
  const fora = evs.filter(e => e.naoAprovada).length;
  const nAl = evs.filter(e => E.alertas.some(a => a.evento_id === e.id)).length;
  let sub = '';
  if (kind === 'info' && TIP[id]) sub = `${clsChip(TIP[id].classificacao)} <span>${esc(TIP[id].categoria)} · área típica: ${esc(TIP[id].area_tipica)}</span>`;
  if (kind === 'pessoa' && USR[id]) sub = `<span>${esc(USR[id].area)} · ${esc(USR[id].cargo)}</span>`;
  if (kind === 'ferramenta' && FER[id]) sub = `${stTag(id)} <span>${esc(FER[id].tipo)} · finalidade aprovada: ${esc(FER[id].finalidade)}</span>`;
  const dims = { info: [['pessoa', e => e.usuario_id, 'Quem usou'], ['ferramenta', e => e.ferramenta_id, 'Em quais ferramentas'], ['area', e => e.area, 'De quais áreas']],
    pessoa: [['info', e => e.informacao_id, 'Quais informações'], ['ferramenta', e => e.ferramenta_id, 'Em quais ferramentas']],
    ferramenta: [['info', e => e.informacao_id, 'Quais informações'], ['pessoa', e => e.usuario_id, 'Quem usou'], ['area', e => e.area, 'De quais áreas']],
    area: [['info', e => e.informacao_id, 'Quais informações'], ['ferramenta', e => e.ferramenta_id, 'Em quais ferramentas'], ['pessoa', e => e.usuario_id, 'Quem usou']] }[kind];
  const gKind = kind === 'info' ? 'ferramenta' : 'info';
  const gKey = gKind === 'ferramenta' ? (e => e.ferramenta_id) : (e => e.informacao_id);
  const groups = {};
  evs.forEach(e => { const k = gKey(e); (groups[k] = groups[k] || []).push(e); });
  const gList = Object.entries(groups).sort((a, b) => {
    const s = (l) => Math.min(...l.map(e => RORD[e.risco] ?? 9));
    return s(a[1]) - s(b[1]) || b[1].length - a[1].length;
  });
  const who = (e) => kind === 'pessoa' ? esc(e.ferramenta) : `${esc(nomeUsr(e.usuario_id))} <span class="muted">· ${esc(kind === 'ferramenta' ? e.informacao : e.area)}</span>`;
  const kpi = (l, v, f) => `<div class="kpi"><span class="lab">${l}</span><span class="val">${v}</span>${f ? `<span class="foot">${f}</span>` : ''}</div>`;
  return `<div class="mtitle"><h2>${esc(K.label(id))}</h2>${sub ? `<p>${sub}</p>` : '<p></p>'}</div>
    <section class="kpis">
      ${kpi('Usos em IA', num(evs.length), `${srcTag('planilha')} ${evs.filter(e => e.fonte === 'planilha').length} ${srcTag('coleta')} ${evs.filter(e => e.fonte === 'coleta').length}`)}
      ${kind === 'pessoa' ? kpi('Informações', new Set(evs.map(e => e.informacao_id)).size, 'distintas') : kpi('Pessoas', new Set(evs.map(e => e.usuario_id)).size, 'distintas')}
      ${kind === 'ferramenta' ? kpi('Informações', new Set(evs.map(e => e.informacao_id)).size, 'distintas') : kpi('Ferramentas', new Set(evs.map(e => e.ferramenta_id)).size, 'distintas')}
      ${kpi('Alto ou crítico', num(ac), `${num(nAl)} com alerta`)}
      ${kpi('Em ferramenta não aprovada', num(fora), pct(evs.length ? fora / evs.length : 0) + ' dos usos')}
    </section>
    ${evs.length ? `<div class="flows">${dims.map(d => rankList(evs, d[1], d[0], d[2], 5)).join('')}</div>
    <section class="card mt"><div class="card-h"><h3>Linha do tempo</h3><span class="hint">Agrupada por ${gKind === 'ferramenta' ? 'ferramenta' : 'informação'}, mais arriscado primeiro</span></div>
      ${gList.map(([k, l], i) => {
        const rc = count(l, e => e.risco);
        return `<details class="grp" ${i < 2 ? 'open' : ''}><summary><b>${esc(KINDS[gKind].label(k))}</b> ${gKind === 'ferramenta' ? stTag(k) : clsChip(l[0].sensibilidade)}<span class="cnt">${RISCOS.filter(r => rc[r]).map(r => `${riskChip(r)} ${rc[r]}`).join(' ')}</span></summary>
        <ul class="tl">${l.map(e => `<li><span class="d">${dtBR(e.ts)}</span><span>${who(e)}<br><span class="muted small">${esc(e.forma_uso)} · ${esc(e.finalidade)}</span></span><span class="x">${srcTag(e.fonte)} ${riskChip(e.risco)} <a href="${link(['investigar', 'evento', e.id])}" class="small">evidência →</a></span></li>`).join('')}</ul></details>`;
      }).join('')}
    </section>
    <div class="mfoot"><a href="${href(['alertas'], { ...gq(), status: 'Todos', busca: K.label(id) })}">Ver alertas relacionados →</a></div>` : '<div class="card empty-state">Nenhum uso no recorte atual. Remova filtros para ver o histórico completo.</div>'}`;
}
function openModal(kind, id) {
  const el = document.getElementById('modal');
  if (el.hidden) MODAL.stack = [];
  const top = MODAL.stack[MODAL.stack.length - 1];
  if (!top || top[0] !== kind || top[1] !== id) MODAL.stack.push([kind, id]);
  drawModal();
}
function drawModal() {
  const el = document.getElementById('modal');
  const [kind, id] = MODAL.stack[MODAL.stack.length - 1];
  el.hidden = false; document.body.style.overflow = 'hidden';
  el.innerHTML = `<div class="mback" data-mclose></div>
    <div class="mbox" role="dialog" aria-modal="true" aria-label="${esc(KIND_NOME[kind])}">
      <div class="mhead">${MODAL.stack.length > 1 ? '<button class="btn" type="button" data-mvoltar>← Voltar</button>' : ''}<span class="mkind">${KIND_NOME[kind]}</span><button class="mx" type="button" data-mclose aria-label="Fechar">×</button></div>
      <div class="mbody">${entidadeHTML(kind, id)}</div>
    </div>`;
  el.querySelectorAll('[data-mclose]').forEach(b => b.onclick = closeModal);
  const v = el.querySelector('[data-mvoltar]'); if (v) v.onclick = () => { MODAL.stack.pop(); drawModal(); };
  el.querySelector('.mx').focus();
  el.scrollTop = 0;
}
function closeModal() {
  const el = document.getElementById('modal');
  if (el.hidden) return;
  el.hidden = true; el.innerHTML = ''; MODAL.stack = []; document.body.style.overflow = '';
}
// links para informação/pessoa/ferramenta/área/evento abrem o modal em vez de trocar de página
const RX_ENT = /^#\/investigar\/(info|pessoa|ferramenta|area|evento)\/([^?]+)/;
document.addEventListener('click', (ev) => {
  const a = ev.target.closest && ev.target.closest('a[href^="#/investigar/"]');
  if (!a) return;
  const m = a.getAttribute('href').match(RX_ENT);
  if (!m) return;
  ev.preventDefault();
  openModal(m[1], decodeURIComponent(m[2]));
});
document.addEventListener('keydown', (ev) => { if (ev.key === 'Escape') closeModal(); });

// =====================================================================
// TRATAMENTO DOS ALERTAS — rotina Aberto → Em análise → Tratado
// Demonstração: o que se faz aqui fica salvo só neste navegador (localStorage).
// Na operação, essas ações vão para o coletor (API) e entram no histórico de auditoria.
// =====================================================================
const TKEY = 'gerencia-tratamento-v1';
let TRAT = {};
try { TRAT = JSON.parse(localStorage.getItem(TKEY) || '{}') || {}; } catch (e) { TRAT = {}; }
const salvarTrat = () => { try { localStorage.setItem(TKEY, JSON.stringify(TRAT)); } catch (e) { /* navegador sem armazenamento: vale só nesta sessão */ } };
const RESPONSAVEIS = ['Segurança', 'Compliance', 'Privacidade', 'Gestor da área'];
// responsável sugerido pela regra que decidiu o risco (proposta; a base traz o responsável já atribuído)
const RESP_POR_REGRA = { R03: 'Segurança', R06: 'Segurança', R04: 'Privacidade', R01: 'Compliance', R02: 'Compliance', R05: 'Compliance' };
const DESFECHOS = ['Risco confirmado, ação aplicada', 'Uso autorizado, exceção registrada', 'Falso positivo', 'Escalado para Jurídico/Privacidade'];
const ACOES = ['Colaborador orientado', 'Credencial revogada e rotacionada', 'Acesso à ferramenta bloqueado', 'Conteúdo removido da ferramenta', 'Comunicado à Privacidade (LGPD)', 'Nenhuma ação necessária'];
const agora = () => { const d = new Date(); const p = (n) => String(n).padStart(2, '0'); return `${d.getFullYear()}-${p(d.getMonth() + 1)}-${p(d.getDate())}T${p(d.getHours())}:${p(d.getMinutes())}:00`; };
function aplicarTrat() {
  Object.values(TRAT).filter(t => t.novo && !ALT[t.id]).forEach(t => {
    const ev = EVT[t.evento_id]; if (!ev) return;
    const a = { id: t.id, evento_id: ev.id, ts: dtBR(ev.ts), data: ev.data, iso: ev.ts.slice(0, 16), usuario_id: ev.usuario_id, area: ev.area, ferramenta: ev.ferramenta,
      informacao: ev.informacao, sensibilidade: ev.sensibilidade, risco: ev.risco, regra: ev.regra, evidencia: '', status: 'Aberto', responsavel: t.resp,
      ferramenta_id: ev.ferramenta_id, informacao_id: ev.informacao_id, fonte: ev.fonte };
    E.alertas.push(a); ALT[a.id] = a;
  });
  E.alertas.forEach(a => { const t = TRAT[a.id]; if (t) { a.status = t.status; a.responsavel = t.resp || a.responsavel; a.trat = t; } });
}
function registrar(id, para, extra = {}) {
  const a = ALT[id]; if (!a) return;
  const t = TRAT[id] || (TRAT[id] = { id, hist: [] });
  t.hist = t.hist || [];
  t.hist.push({ ts: agora(), de: a.status, para, por: 'Você (demonstração)', nota: extra.nota || '' });
  Object.assign(t, { status: para, resp: extra.resp || t.resp || a.responsavel }, extra.campos || {});
  salvarTrat(); aplicarTrat(); render();
}
function abrirAlertaDe(evId) {
  const ev = EVT[evId]; if (!ev) return;
  const n = Object.values(TRAT).filter(t => t.novo).length + 1;
  const id = 'ALT-D' + String(n).padStart(3, '0');
  TRAT[id] = { id, novo: true, evento_id: evId, status: 'Aberto', resp: RESP_POR_REGRA[ev.regra] || 'Gestor da área',
    hist: [{ ts: agora(), de: '—', para: 'Aberto', por: 'Você (demonstração)', nota: 'Alerta aberto a partir de evento sem alerta' }] };
  salvarTrat(); aplicarTrat();
  setQ({ status: 'Aberto', sel: id, page: '' });
}
function blocoTratamento(a, ev) {
  if (!a) {
    return `<div class="trat"><h3>Tratamento</h3>
      <p class="muted small" style="margin:0 0 10px">Este evento ainda não tem alerta. Abrir o alerta coloca o caso na fila do responsável.</p>
      <dl class="res"><dt>Responsável</dt><dd><b>${esc(RESP_POR_REGRA[ev && ev.regra] || 'Gestor da área')}</b> <span class="muted small">(sugerido pela regra ${esc(ev ? ev.regra : '')})</span></dd></dl>
      <div class="acts"><button class="btn primary" type="button" id="t-abrir">Abrir alerta</button></div>
      <p class="demo">Demonstração: fica salvo só neste navegador.</p></div>`;
  }
  const t = a.trat || {};
  const passos = ['Aberto', 'Em análise', 'Tratado'];
  const idx = passos.indexOf(a.status);
  const steps = `<div class="steps">${passos.map((p, i) => `<span class="${i < idx ? 'done' : i === idx ? 'cur' + (p === 'Aberto' ? ' aberto' : '') : ''}">${p}</span>`).join('')}</div>`;
  const respSel = `<label>Responsável<select id="t-resp">${RESPONSAVEIS.map(r => `<option ${r === a.responsavel ? 'selected' : ''}>${esc(r)}</option>`).join('')}</select></label>`;
  let corpo = '';
  if (a.status === 'Aberto') {
    corpo = `${respSel}<div class="acts"><button class="btn primary" type="button" id="t-assumir">Assumir análise</button></div>`;
  } else if (a.status === 'Em análise') {
    corpo = `${respSel}
      <label>Desfecho<select id="t-desf"><option value="">Escolha…</option>${DESFECHOS.map(d => `<option>${esc(d)}</option>`).join('')}</select></label>
      <label>Ação tomada<select id="t-acao"><option value="">Escolha…</option>${ACOES.map(d => `<option>${esc(d)}</option>`).join('')}</select></label>
      <label>Comentário<textarea id="t-com" placeholder="O que foi verificado e com quem se falou"></textarea></label>
      <div class="acts"><button class="btn primary" type="button" id="t-tratar" disabled>Marcar como tratado</button><button class="btn" type="button" id="t-voltar">Devolver para aberto</button></div>`;
  } else {
    corpo = t.desfecho
      ? `<dl class="res"><dt>Desfecho</dt><dd>${esc(t.desfecho)}</dd><dt>Ação</dt><dd>${esc(t.acao)}</dd><dt>Comentário</dt><dd>${esc(t.comentario)}</dd><dt>Tratado em</dt><dd>${dtBR(t.tratadoEm)}</dd></dl>`
      : `<p class="note" style="margin:0 0 12px">Marcado como tratado na base de origem, sem desfecho nem data registrados.</p>`;
    corpo += `<div class="acts"><button class="btn" type="button" id="t-reabrir">Reabrir</button></div>`;
  }
  const hist = (t.hist || []).slice().reverse();
  return `<div class="trat"><h3>Tratamento</h3>${steps}${corpo}
    ${hist.length ? `<ul class="hist2">${hist.map(h => `<li><b>${esc(h.de)} → ${esc(h.para)}</b> · ${dtBR(h.ts)} · ${esc(h.por)}${h.nota ? `<br>${esc(h.nota)}` : ''}</li>`).join('')}</ul>` : ''}
    <p class="demo">Demonstração: o tratamento fica salvo só neste navegador.</p></div>`;
}
function bindTratamento(root, a, ev) {
  const q = (s) => root.querySelector(s);
  if (q('#t-abrir')) q('#t-abrir').onclick = () => abrirAlertaDe(ev.id);
  if (!a) return;
  const resp = () => (q('#t-resp') ? q('#t-resp').value : a.responsavel);
  if (q('#t-resp')) q('#t-resp').onchange = () => registrar(a.id, a.status, { resp: resp(), nota: `Responsável alterado para ${resp()}` });
  if (q('#t-assumir')) q('#t-assumir').onclick = () => registrar(a.id, 'Em análise', { resp: resp(), nota: 'Análise assumida' });
  if (q('#t-voltar')) q('#t-voltar').onclick = () => registrar(a.id, 'Aberto', { nota: 'Devolvido para a fila' });
  if (q('#t-reabrir')) q('#t-reabrir').onclick = () => registrar(a.id, 'Aberto', { nota: 'Reaberto' });
  const ok = q('#t-tratar');
  if (ok) {
    const check = () => { ok.disabled = !(q('#t-desf').value && q('#t-acao').value && q('#t-com').value.trim()); };
    ['#t-desf', '#t-acao', '#t-com'].forEach(s => { q(s).oninput = check; q(s).onchange = check; });
    ok.onclick = () => registrar(a.id, 'Tratado', { resp: resp(), nota: q('#t-com').value.trim(),
      campos: { desfecho: q('#t-desf').value, acao: q('#t-acao').value, comentario: q('#t-com').value.trim(), tratadoEm: agora() } });
  }
}

// ---------------- render ----------------
const VISTAS = { acompanhamento: vistaAcompanhamento, investigar: vistaInvestigar, alertas: vistaAlertas, governanca: vistaGovernanca };
let lastPath = '';
function render() {
  parseHash();
  const v = VISTAS[route.path[0]] || vistaAcompanhamento;
  renderNav();
  const main = document.getElementById('main');
  const keepScroll = route.path.join('/') === lastPath;
  const y = window.scrollY;
  v(main);
  mountFilters(main);
  window.scrollTo(0, keepScroll ? y : 0);
  lastPath = route.path.join('/');
  document.getElementById('tip').hidden = true;
}
document.getElementById('disc').textContent = E.meta.aviso;
document.getElementById('foot').textContent = `${E.meta.aviso} Fonte: ${E.meta.fonte}. Gerado em ${dtBR(E.meta.gerado_em)}.`;
window.addEventListener('hashchange', () => { closeModal(); render(); });


// tooltip único
const tip = document.getElementById('tip');
document.addEventListener('mousemove', (ev) => {
  const t = ev.target.closest && ev.target.closest('[data-tip]');
  if (!t) { tip.hidden = true; return; }
  tip.innerHTML = t.getAttribute('data-tip'); tip.hidden = false;
  const r = tip.getBoundingClientRect();
  let x = ev.clientX + 14, y = ev.clientY + 14;
  if (x + r.width > innerWidth - 8) x = ev.clientX - r.width - 14;
  if (y + r.height > innerHeight - 8) y = ev.clientY - r.height - 14;
  tip.style.left = x + 'px'; tip.style.top = y + 'px';
});
aplicarTrat();
render();
</script>
