              ${x.achados.map(a => `
                <div class="achado ${a.contextual ? "contextual" : ""}">
                  <div class="top">${chipRegra(a.regra)} <span class="tit">${esc(a.titulo)}</span> ${chipSev(a.nivel)}</div>
                  <p class="mot">${esc(a.motivo)}</p>
                  <div class="acao"><b>ação prevista</b>${esc(a.acao)}</div>
                </div>`).join("")}
            </td></tr>`).join("")}</tbody>
        </table></div>
      </div>

      <div class="panel" style="margin-top:16px">
        <div class="panel-h"><h3>Por que os casos passam sem ajuste individual</h3></div>
        <div class="panel-b" style="display:flex;flex-direction:column;gap:12px">
          <p class="nota" style="margin:0">O motor não tem exceção escrita para nenhum caso. Ele aplica
          as catorze regras em ordem de precedência e deixa a mais severa decidir. Dois casos mostram
          por que a ordem importa:</p>
          <p class="nota" style="margin:0"><strong>CV12</strong> — credencial numa ferramenta
          <em>aprovada</em>. Se a precedência começasse pela ferramenta, daria Médio. Como R03 vem
          antes de tudo que fala em ferramenta, dá Crítico, que é o esperado.</p>
          <p class="nota" style="margin:0"><strong>CV13</strong> — ferramenta desconhecida e
          informação sem classificação. Nenhuma regra de conteúdo se aplica; a resposta correta é
          recusar-se a classificar. R14 devolve REVISAR em vez de inventar um nível.</p>
        </div>
      </div>`;

    document.querySelectorAll("[data-caso]").forEach(tr => tr.addEventListener("click", () => {
      const det = document.getElementById("det-" + tr.dataset.caso);
      if (det) det.hidden = !det.hidden;
    }));
  }

  // ============================================================
  // POLÍTICA
  // ============================================================

  function vistaPolitica() {
    const p = D.politica;
    document.getElementById("main").innerHTML = `
      <div class="pagehead">
        <h2>Política vigente</h2>
        <p>As catorze regras vêm da aba <span class="mono">Regras_Risco</span> da planilha. Nenhuma
        está reescrita: o que a GerencIA acrescenta é a <strong>ordem de precedência</strong>, porque
        política escrita em linguagem natural se sobrepõe — e é essa ordem que Compliance audita.</p>
      </div>

      <div class="grid" style="grid-template-columns:repeat(auto-fit,minmax(330px,1fr))">
        <div class="panel">
          <div class="panel-h"><h3>Ordem de precedência</h3><span class="hint">da primeira à última avaliada</span></div>
          <div class="panel-b"><ol class="lista-num">${p.precedencia.map(x => `<li>${esc(x)}</li>`).join("")}</ol></div>
        </div>
        <div class="panel">
          <div class="panel-h"><h3>Níveis de classificação</h3><span class="hint">definidos pela empresa</span></div>
          <div class="panel-b"><div class="tw"><table><tbody>${p.classificacoes.map(c => `
            <tr><td style="width:1%">${chipCls(c.classificacao)}</td>
              <td><div style="font-size:12.5px">${esc(c.definicao)}</div>
                <div class="dim" style="font-size:12px;margin-top:3px">${esc(c.regra_geral)}</div></td>
              <td class="nowrap dim mono" style="font-size:11.5px">risco base<br>${esc(c.risco_base)}</td></tr>`).join("")}
          </tbody></table></div></div>
        </div>
      </div>

      <div class="panel" style="margin-top:16px">
        <div class="panel-h"><h3>As catorze regras</h3>
          <span class="hint">“usos” compara quantas vezes cada regra aparece na base e no nosso motor</span></div>
        <div class="tw"><table>
          <thead><tr><th>Regra</th><th>Tema</th><th>Texto da política</th><th>Nível</th><th>Ação</th>
            <th class="num">Usos na base</th><th class="num">Usos no motor</th></tr></thead>
          <tbody>${p.regras.map(r => {
            const morta = r.usos_base === 0;
            return `<tr>
              <td>${chipRegra(r.id)}</td>
              <td class="dim" style="font-size:12px">${esc(r.tema)}</td>
              <td style="font-size:12.5px;max-width:40ch">${esc(r.texto)}</td>
              <td>${r.nivel === "—" ? "" : chipSev(r.nivel === "Crítico" || r.nivel === "Alto" || r.nivel === "Médio" || r.nivel === "Baixo" ? r.nivel : "REVISAR")}</td>
              <td class="dim" style="font-size:12px;max-width:28ch">${esc(r.acao)}</td>
              <td class="num" style="${morta ? "color:var(--sev-Critico);font-weight:600" : ""}">${r.usos_base}</td>
              <td class="num">${r.usos_total}</td>
            </tr>`;
          }).join("")}</tbody>
        </table></div>
        <div class="panel-b" style="border-top:1px solid var(--line)">
          <p class="nota" style="margin:0">As regras com <strong style="color:var(--sev-Critico)">zero</strong>
          usos na base nunca foram acionadas pela rotulagem existente. No nosso motor algumas delas passam a
          aparecer — não porque mudamos o nível de risco, mas porque a regra específica descreve melhor o fato e
          <em>aciona uma resposta diferente</em>. O detalhe está em Auditoria.</p>
        </div>
      </div>

      <div class="panel" style="margin-top:16px">
        <div class="panel-h"><h3>Propostas de política</h3>
          <span class="hint">não são regras da planilha — são lacunas que a auditoria encontrou</span></div>
        <div class="tw"><table>
          <thead><tr><th>Proposta</th><th>Tema</th><th>Regra sugerida</th><th>Nível</th><th>Por quê</th></tr></thead>
          <tbody>${p.propostas.map(x => `
            <tr><td class="mono" style="color:var(--accent)">${esc(x.id)}</td>
              <td class="dim" style="font-size:12px">${esc(x.tema)}</td>
              <td style="font-size:12.5px"><strong>${esc(x.regra)}</strong>
                <div class="dim" style="font-size:12px;margin-top:2px">${esc(x.acao)}</div></td>
              <td>${x.nivel === "—" ? '<span class="dim">—</span>' : chipSev(x.nivel)}</td>
              <td class="dim" style="font-size:12px;max-width:44ch">${esc(x.porque)}</td></tr>`).join("")}</tbody>
        </table></div>
      </div>

      <div class="panel" style="margin-top:16px">
        <div class="panel-b" style="display:flex;flex-wrap:wrap;gap:14px;align-items:center">
          <div style="flex:1 1 320px">
            <div class="eyebrow" style="margin-bottom:4px">Para mudar qualquer regra desta tela</div>
            <p class="nota" style="margin:0">Edite a aba <span class="mono">Regras_Risco</span> da planilha e rode
            <span class="mono">python3 run.py gerar</span>. O motor lê os níveis e as ações direto de lá — o código
            não tem os textos das regras escritos dentro dele. Esta tela é deliberadamente
            <strong>somente leitura</strong>: a política precisa viver num arquivo versionado, com histórico de
            quem mudou o quê.</p>
          </div>
          <div class="formula" style="flex:1 1 280px;white-space:normal">Base_de_Dados_Starkbank.xlsx
  ├ Classificacao_Informacao  níveis
  ├ Ferramentas_IA            cadastro e status
  ├ Tipos_Informacao          classificação padrão
  └ Regras_Risco              R01–R14, nível e ação</div>
        </div>
      </div>`;
  }

  // ============================================================
  // INVENTÁRIO
  // ============================================================

  function vistaInventario() {
    const usoFerr = {};
    for (const e of D.eventos) {
      const v = usoFerr[e.ferramenta_id] ||= { n: 0, sens: 0, risco: 0, users: new Set() };
      v.n++; v.users.add(e.usuario_id);
      if (e.sensibilidade === "Confidencial" || e.sensibilidade === "Crítica") v.sens++;
      if (e.risco === "Crítico" || e.risco === "Alto") v.risco++;
    }
    const usoTipo = {};
    for (const e of D.eventos) (usoTipo[e.informacao_id] = (usoTipo[e.informacao_id] || 0) + 1);

    document.getElementById("main").innerHTML = `
      <div class="pagehead">
        <h2>Inventário</h2>
        <p>O que a organização declara possuir: oito ferramentas de IA, vinte tipos de informação
        classificados e sete fontes de log que alimentam a rastreabilidade.</p>
      </div>

      <div class="panel">
        <div class="panel-h"><h3>Ferramentas de IA</h3>
          <span class="hint">status e controles vêm do cadastro da governança</span></div>
        <div class="tw"><table>
          <thead><tr><th>Ferramenta</th><th>Tipo</th><th>Status</th><th>Uso principal</th>
            <th>Finalidade aprovada</th><th>Controles</th><th>Logs</th>
            <th class="num">Eventos</th><th class="num">Pessoas</th><th class="num">Sensíveis</th><th class="num">Alto/crítico</th></tr></thead>
          <tbody>${D.ferramentas.map(f => {
            const u = usoFerr[f.id] || { n: 0, sens: 0, risco: 0, users: new Set() };
            return `<tr>
              <td><span class="mono dim" style="font-size:11px">${f.id}</span><br><strong>${esc(f.nome)}</strong></td>
              <td class="dim">${esc(f.tipo)}</td>
              <td>${chipStatusFerr(f)}</td>
              <td class="dim" style="font-size:12px">${esc(f.uso_principal)}</td>
              <td class="dim" style="font-size:12px">${esc(f.finalidade)}</td>
              <td class="dim" style="font-size:12px;max-width:26ch">${esc(f.controles)}</td>
              <td class="mono" style="font-size:12px;color:${f.logs === "Sim" ? "var(--ok)" : f.logs === "Parcial" ? "var(--sev-Alto)" : "var(--sev-Critico)"}">${esc(f.logs)}</td>
              <td class="num">${u.n}</td><td class="num">${u.users.size}</td>
              <td class="num">${u.sens}</td>
              <td class="num" style="${u.risco ? "color:var(--sev-Critico);font-weight:600" : "color:var(--ink-3)"}">${u.risco}</td>
            </tr>`;
          }).join("")}</tbody>
        </table></div>
      </div>

      <div class="panel" style="margin-top:16px">
        <div class="panel-h"><h3>Tipos de informação</h3><span class="hint">a classificação acontece aqui, uma vez, na origem</span></div>
        <div class="tw"><table>
          <thead><tr><th>Tipo</th><th>Categoria</th><th>Classificação padrão</th><th>Área típica</th><th class="num">Eventos</th></tr></thead>
          <tbody>${D.tipos.slice().sort((a, b) =>
            CLASSES.indexOf(a.classificacao) - CLASSES.indexOf(b.classificacao) || a.nome.localeCompare(b.nome)
          ).map(t => `
            <tr class="clicavel" data-alvo-info="${t.id}">
              <td><span class="mono dim" style="font-size:11px">${t.id}</span><br>${esc(t.nome)}</td>
              <td class="dim" style="font-size:12px">${esc(t.categoria)}</td>
              <td>${chipCls(t.classificacao)}</td>
              <td class="dim" style="font-size:12px">${esc(t.area_tipica)}</td>
              <td class="num">${usoTipo[t.id] || 0}</td>
            </tr>`).join("")}</tbody>
        </table></div>
      </div>

      <div class="panel" style="margin-top:16px">
        <div class="panel-h"><h3>Fontes de log</h3>
          <span class="hint">é daqui que a captura híbrida tira os eventos</span></div>
        <div class="tw"><table>
          <thead><tr><th>Fonte</th><th>Dados disponíveis</th><th>Formato</th><th>Confiabilidade</th><th>Atualização</th></tr></thead>
          <tbody>${D.fontes.map(f => `
            <tr><td><span class="mono dim" style="font-size:11px">${f.id}</span><br>${esc(f.nome)}</td>
              <td style="font-size:12.5px">${esc(f.dados)}</td>
              <td class="dim">${esc(f.formato)}</td>
              <td class="dim">${esc(f.confiabilidade)}</td>
              <td class="dim">${esc(f.atualizacao)}</td></tr>`).join("")}</tbody>
        </table></div>
        <div class="panel-b" style="border-top:1px solid var(--line)">
          <p class="nota" style="margin:0">Os 650 eventos da base chegaram por quatro caminhos —
          DLP, log de aplicação, proxy corporativo e registro manual. Nenhum sozinho vê tudo:
          é por isso que a arquitetura é híbrida.</p>
        </div>
      </div>`;
  }

  // ============================================================
  // roteamento
  // ============================================================

  const VISTAS = {
    panorama: vistaPanorama, rastrear: vistaRastrear, alertas: vistaAlertas, captura: vistaCaptura,
    auditoria: vistaAuditoria, validacao: vistaValidacao, politica: vistaPolitica,
    inventario: vistaInventario
  };

  function ir(vista) {
    estado.vista = vista;
    document.querySelectorAll(".navbtn").forEach(b =>
      b.setAttribute("aria-current", b.dataset.vista === vista ? "true" : "false"));
    VISTAS[vista]();
    window.scrollTo({ top: 0, behavior: "instant" });
  }

  document.querySelectorAll(".navbtn").forEach(b =>
    b.addEventListener("click", () => ir(b.dataset.vista)));

  document.addEventListener("click", ev => {
    const irVista = ev.target.closest("[data-ir-vista]");
    if (irVista) { ir(irVista.dataset.irVista); return; }

    const alvoInfo = ev.target.closest("[data-alvo-info]");
    if (alvoInfo) {
      estado.modoRastreio = "informacao";
      estado.alvoRastreio = alvoInfo.dataset.alvoInfo;
      estado.busca = tipoPorId[estado.alvoRastreio]?.nome || "";
      ir("rastrear"); return;
    }

    const alvo = ev.target.closest("[data-alvo]");
    if (alvo && estado.vista === "rastrear") {
      estado.alvoRastreio = alvo.dataset.alvo;
      const item = tipoPorId[alvo.dataset.alvo] || userPorId[alvo.dataset.alvo];
      estado.busca = item ? item.nome : "";
      vistaRastrear(); return;
    }

    const evtIr = ev.target.closest("[data-evt-ir]");
    if (evtIr) {
      estado.eventoAberto = evtIr.dataset.evtIr;
      Object.assign(estado, FILTROS_VAZIOS);
      ir("alertas"); return;
    }

    const filtrar = ev.target.closest("[data-filtrar-eventos]");
    if (filtrar) {
      const achado = D.auditoria.find(a => a.id === filtrar.dataset.filtrarEventos);
      if (achado) {
        Object.assign(estado, FILTROS_VAZIOS);
        estado.eventoAberto = achado.eventos[0];
        estado.fSoDiverg = achado.id === "A-03" ? "1" : "";
        ir("alertas");
      }
      return;
    }

    const linha = ev.target.closest("[data-evt]");
    if (linha) {
      estado.eventoAberto = linha.dataset.evt;
      document.querySelectorAll("[data-evt]").forEach(r => r.classList.toggle("sel", r === linha));
      renderEvidencia();
    }
  });

  document.getElementById("tema").addEventListener("click", () => {
    const atual = document.documentElement.getAttribute("data-theme");
    const escuro = atual ? atual === "dark" : window.matchMedia("(prefers-color-scheme: dark)").matches;
    document.documentElement.setAttribute("data-theme", escuro ? "light" : "dark");
    VISTAS[estado.vista]();
  });

  // contadores do rail
  document.getElementById("n-panorama").textContent = num(D.meta.totais.eventos);
  document.getElementById("n-alertas").textContent = num(D.alertas.length);
  document.getElementById("n-captura").textContent = num(D.eventos.filter(e => e.id.startsWith("CAP-")).length);
  document.getElementById("n-auditoria").textContent = D.auditoria.length;
  document.getElementById("n-validacao").textContent =
    D.validacao.filter(v => v.passou).length + "/" + D.validacao.length;
  document.getElementById("n-politica").textContent = D.politica.regras.length;
  document.getElementById("n-inventario").textContent = D.ferramentas.length;
  document.getElementById("disclaimer").textContent = D.meta.aviso;

  ir("panorama");
})();
</script>
